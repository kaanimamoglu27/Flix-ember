<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d81e27"><style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}</style></head><body><title>Flix Direktör</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800;1,900&family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: tek ekran oyun. Üstte skorbord, ortada kırmızı saha (lacivert çizgi), altta karar kartları; ana buton hep sağ altta. */
:root{
  --red:#d81e27; --red-deep:#b3141c; --pitch-a:#c4161f; --pitch-b:#b8121b;
  --navy:#15215c; --navy-deep:#0c1440; --yellow:#ffc72c; --yellow-deep:#e9a800;
  --paper:#fff4dc; --paper-edge:#f1dfb5; --ink:#15215c; --ok:#178a4a; --bad:#c8102e; --mute:#6b6f8c;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%;}
[hidden]{display:none!important;}
body{background:var(--red);color:#fff;font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;}
button:focus-visible,.pcard:focus-visible,.tok:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 14px;}
.disp{font-family:var(--display);font-weight:800;font-style:italic;letter-spacing:.01em;text-transform:uppercase;line-height:.95;}
.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 26px;border-radius:14px;background:var(--yellow);color:var(--navy);font-family:var(--display);font-weight:800;font-style:italic;font-size:24px;text-transform:uppercase;letter-spacing:.02em;border:3px solid var(--navy);box-shadow:0 5px 0 var(--navy);transition:transform .08s,box-shadow .08s;}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--navy);}
.btn[disabled]{opacity:.45;pointer-events:none;}
.btn.ghost{background:transparent;color:#fff;border-color:#fff;box-shadow:none;font-size:19px;min-height:46px;padding:0 16px;}
.row-end{display:flex;justify-content:flex-end;align-items:center;gap:10px;}

/* ---------- Ana ekran ---------- */
#home{justify-content:space-between;background:
  repeating-linear-gradient(180deg,var(--red) 0 46px,var(--red-deep) 46px 92px);}
.home-top{display:flex;align-items:center;justify-content:space-between;}
.home-top img{width:84px;height:auto;filter:drop-shadow(0 3px 0 rgba(12,20,64,.35));}
.career{background:var(--navy);border-radius:12px;padding:8px 12px;text-align:right;border:2px solid var(--navy-deep);}
.career b{display:block;font-family:var(--display);font-style:italic;font-size:26px;color:var(--yellow);line-height:1;}
.career span{font-size:11px;opacity:.85;}
.hero{position:relative;padding:8px 0 0;}
.hero h1{font-size:clamp(64px,21vw,104px);margin:0;color:#fff;text-shadow:4px 4px 0 var(--navy);}
.hero h1 small{display:block;font-size:.42em;color:var(--yellow);text-shadow:3px 3px 0 var(--navy);margin-bottom:4px;}
.hero p{margin:14px 0 0;max-width:30ch;font-size:15px;line-height:1.45;}
.fan{position:relative;height:190px;margin:4px 0;}
.fan .pcard{position:absolute;width:118px;left:50%;top:10px;pointer-events:none;}
.home-actions{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;}

/* ---------- Maç listesi ---------- */
#list{background:var(--red);}
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;}
.top-bar h2{margin:0;font-size:34px;color:#fff;text-shadow:2px 2px 0 var(--navy);}
.matches{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:10px 2px 90px;-webkit-overflow-scrolling:touch;}
.mcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--paper);color:var(--ink);border:3px solid var(--navy);border-radius:14px;padding:12px;box-shadow:0 4px 0 var(--navy);}
.mcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy);}
.mcard .kits{display:flex;align-items:center;}
.mcard .kits svg{width:40px;height:40px;}
.mcard .kits svg+svg{margin-left:-10px;}
.mcard h3{margin:0;font-family:var(--display);font-style:italic;font-weight:800;font-size:23px;text-transform:uppercase;line-height:1;}
.mcard .sub{font-size:12.5px;margin-top:3px;color:var(--mute);}
.mcard .you{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;background:var(--navy);color:var(--yellow);padding:2px 7px;border-radius:5px;letter-spacing:.06em;text-transform:uppercase;}
.best{text-align:center;min-width:52px;}
.best b{display:block;font-family:var(--display);font-style:italic;font-size:30px;line-height:1;}
.best span{font-size:10px;color:var(--mute);font-weight:700;letter-spacing:.08em;}
.list-foot{position:absolute;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--red) 40%);}

/* ---------- Maç ekranı ---------- */
#match{padding-top:8px;gap:7px;}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--navy);border:2px solid var(--navy-deep);border-radius:14px;padding:6px 10px;gap:8px;}
.bteam{display:flex;align-items:center;gap:6px;min-width:0;}
.bteam.r{justify-content:flex-end;}
.bteam svg{width:30px;height:30px;flex:none;}
.bteam span{font-family:var(--display);font-style:italic;font-weight:800;font-size:19px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bteam.me span{color:var(--yellow);}
.bscore{text-align:center;}
.bscore b{font-family:var(--display);font-style:italic;font-weight:900;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;}
.bscore em{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--navy);background:var(--yellow);border-radius:4px;padding:0 6px;margin-top:2px;font-variant-numeric:tabular-nums;}
.feed{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-height:26px;}
.feed::-webkit-scrollbar{display:none;}
.ev{flex:none;display:flex;align-items:center;gap:5px;background:rgba(12,20,64,.32);border-radius:8px;padding:4px 8px;font-size:12px;white-space:nowrap;}
.ev b{font-variant-numeric:tabular-nums;}
.ico{display:inline-block;flex:none;}
.ico.ball{width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--navy);}
.ico.yc,.ico.rc{width:8px;height:11px;border-radius:2px;background:var(--yellow);}
.ico.rc{background:#ff3b3b;}
.ico.sub{font-weight:800;font-size:12px;color:var(--yellow);}
.pitch{position:relative;flex:1;min-height:200px;border:3px solid var(--navy);border-radius:10px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--pitch-a) 0 12.5%,var(--pitch-b) 12.5% 25%);}
.pitch .lines{position:absolute;inset:0;width:100%;height:100%;}
.sit{display:flex;flex-wrap:wrap;gap:5px;}
.press{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.06em;}
.press .pb{height:6px;border-radius:3px;background:#9aa6e6;overflow:hidden;}
.press .pb i{display:block;height:100%;background:var(--yellow);}
.press span{font-variant-numeric:tabular-nums;}
.chip{background:var(--navy);color:#fff;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;}
.chip.warn{background:var(--yellow);color:var(--navy);}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:66px;z-index:2;}
.tok.opp{width:40px;z-index:1;}
.tok.opp svg{width:26px;height:26px;}
.tok.opp .sta{width:24px;}
.tok svg{width:29px;height:29px;filter:drop-shadow(0 2px 0 rgba(12,20,64,.45));}
.tok .nm{margin-top:-3px;background:var(--navy);color:#fff;font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis;}
.tok .sta{width:36px;height:3px;background:rgba(12,20,64,.5);border-radius:2px;margin-top:2px;overflow:hidden;}
.tok .sta i{display:block;height:100%;background:#fff;}
.tok .sta i.low{background:var(--yellow);}
.tok .ycd{position:absolute;top:0;right:12px;width:8px;height:11px;border-radius:2px;background:var(--yellow);border:1px solid var(--navy);}
.tok.out{opacity:.35;}
.pitch.compact .tok .nm{display:none;}
.pitch.compact .tok.sel .nm,.pitch.compact .tok.out .nm{display:block;}
.tok.sel svg{transform:scale(1.18);}
.tok.sel .nm{background:var(--yellow);color:var(--navy);}
.tok .note{position:absolute;top:-4px;left:8px;font-size:9.5px;font-weight:800;background:#fff;color:var(--navy);border-radius:4px;padding:0 3px;font-variant-numeric:tabular-nums;}

.hand{display:flex;gap:10px;overflow-x:auto;padding:12px 4px 8px;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:138px;}
.hand::-webkit-scrollbar{display:none;}
.pcard{flex:none;gap:4px;width:140px;min-height:118px;scroll-snap-align:start;background:var(--paper);color:var(--ink);border:3px solid var(--navy);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 4px 0 var(--navy);transition:transform .15s,box-shadow .15s;position:relative;}
.pcard:nth-child(odd){transform:rotate(-1.2deg);}
.pcard:nth-child(even){transform:rotate(1.2deg);}
.pcard.on{transform:translateY(-10px) rotate(0);box-shadow:0 10px 0 var(--navy);background:#fff;outline:3px solid var(--yellow);outline-offset:-7px;}
.pcard .kind{font-family:var(--display);font-style:italic;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px dashed var(--paper-edge);padding-bottom:4px;display:flex;justify-content:space-between;}
.pcard .kind i{font-style:normal;color:var(--mute);font-size:13px;}
.prow{display:grid;grid-template-columns:14px 28px 1fr;gap:4px;align-items:center;}
.prow svg{width:28px;height:28px;}
.prow .arr{font-weight:900;font-size:14px;text-align:center;}
.prow .arr.dn{color:var(--bad);}
.prow .arr.up{color:var(--ok);}
.prow .pn{font-size:12px;font-weight:700;line-height:1.15;min-width:0;}
.prow .pn small{display:block;font-weight:500;color:var(--mute);font-size:10.5px;}
.pcard .big{font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;text-transform:uppercase;line-height:.9;margin-top:4px;}
.pcard .txt{font-size:11px;line-height:1.3;color:#3a3f63;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.pcard.make{background:transparent;border-style:dashed;border-color:var(--paper);color:#fff;box-shadow:none;justify-content:center;align-items:center;text-align:center;}
.pcard.make .big{font-size:24px;}
.act{display:flex;align-items:center;gap:12px;}
.timer{flex:1;}
.timer .bar{height:8px;background:rgba(12,20,64,.4);border-radius:4px;overflow:hidden;}
.timer .bar i{display:block;height:100%;background:var(--yellow);transform-origin:left;}
.timer span{font-size:12px;display:block;margin-top:4px;opacity:.9;}

/* ---------- Alt sayfalar ---------- */
.sheet{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(12,20,64,.55);}
.sheet .panel{background:var(--navy);border-top:3px solid var(--yellow);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out;}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.panel h3{margin:0;font-size:30px;color:var(--yellow);}
.pinfo{display:flex;gap:12px;align-items:center;}
.pinfo svg{width:56px;height:56px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.stat{background:rgba(255,255,255,.08);border-radius:10px;padding:6px;text-align:center;}
.stat b{display:block;font-family:var(--display);font-style:italic;font-size:24px;font-variant-numeric:tabular-nums;}
.stat span{font-size:10px;opacity:.8;letter-spacing:.06em;text-transform:uppercase;}
.bench{display:flex;flex-direction:column;gap:6px;}
.bp{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--paper);color:var(--ink);border-radius:10px;padding:6px 10px;text-align:left;border:2px solid transparent;}
.bp svg{width:34px;height:34px;}
.bp b{font-family:var(--display);font-style:italic;font-size:22px;}
.bp small{display:block;color:var(--mute);font-size:11px;}
.bp[disabled]{opacity:.4;}

.reveal .panel{max-height:94%;}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.vs .col .lbl{margin-bottom:6px;color:var(--yellow);}
.vs .pcard{width:auto;min-height:0;transform:none;box-shadow:0 3px 0 var(--navy-deep);}
.same{background:var(--yellow);color:var(--navy);font-weight:700;font-size:13px;border-radius:8px;padding:6px 10px;text-align:center;}
.evlist{display:flex;flex-direction:column;gap:4px;}
.evlist .ev{background:rgba(255,255,255,.08);white-space:normal;font-size:13px;}
.prob{display:grid;grid-template-columns:62px 1fr 44px;gap:8px;align-items:center;font-size:12.5px;}
.prob .bar{height:12px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;}
.prob .bar i{display:block;height:100%;background:var(--yellow);}
.prob .bar i.c{background:#9aa6e6;}
.prob b{text-align:right;font-variant-numeric:tabular-nums;}
.pts{display:flex;flex-direction:column;gap:6px;}
.pt{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:13px;align-items:start;line-height:1.35;}
.pt b{font-variant-numeric:tabular-nums;font-size:14px;}
.pt b.plus{color:#7be3a6;}
.pt b.minus{color:#ff9a9a;}
.total{display:flex;align-items:flex-end;justify-content:space-between;border-top:2px dashed rgba(255,255,255,.25);padding-top:8px;}
.total b{font-family:var(--display);font-style:italic;font-size:54px;line-height:.85;color:var(--yellow);font-variant-numeric:tabular-nums;}

/* ---------- Final ---------- */
#final{background:var(--navy);overflow-y:auto;gap:12px;}
.fscore{text-align:center;padding-top:6px;}
.fscore .teams{display:flex;justify-content:center;align-items:center;gap:14px;}
.fscore svg{width:48px;height:48px;}
.fscore b{font-family:var(--display);font-style:italic;font-weight:900;font-size:60px;line-height:1;}
.stamp{align-self:center;width:128px;height:128px;border-radius:50%;border:5px solid var(--yellow);color:var(--yellow);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);animation:stamp .35s cubic-bezier(.2,1.6,.4,1);}
@keyframes stamp{from{transform:scale(2.2) rotate(-20deg);opacity:0}to{transform:rotate(-8deg);opacity:1}}
.stamp b{font-family:var(--display);font-style:italic;font-weight:900;font-size:64px;line-height:.85;}
.stamp span{font-size:11px;font-weight:700;letter-spacing:.1em;}
.fbox{background:rgba(255,255,255,.07);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;}
.mrow{display:grid;grid-template-columns:40px 1fr auto;gap:8px;font-size:13px;align-items:center;}
.mrow b{font-family:var(--display);font-style:italic;font-size:22px;}
.mrow .m{font-weight:800;color:var(--yellow);font-variant-numeric:tabular-nums;}
.final-foot{display:flex;justify-content:space-between;gap:10px;padding-top:4px;margin-top:auto;}

#how .panel p{margin:0;font-size:14px;line-height:1.5;}
#how .panel ol{margin:0;padding-left:20px;font-size:14px;line-height:1.5;display:flex;flex-direction:column;gap:6px;}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--yellow);color:var(--navy);font-family:var(--display);font-style:italic;font-weight:900;font-size:44px;padding:6px 22px;border:4px solid var(--navy);border-radius:14px;z-index:30;text-transform:uppercase;animation:pop .9s ease-out forwards;pointer-events:none;white-space:nowrap;}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}25%{transform:translate(-50%,-50%) scale(1.08);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
@media (max-height:700px){.fan{height:150px}}
</style>

<div id="app">
  <section class="screen" id="home">
    <div class="home-top">
      <img id="logo" alt="Flix">
      <div class="career"><b id="cPts">0</b><span id="cRank">Amatör Hoca</span></div>
    </div>
    <div class="hero">
      <h1 class="disp"><small>Flix</small>Direktör</h1>
      <p>Gerçek maç akışında kulübede sen varsın. Kimi alırsın, kimi çıkarırsın, ne zaman? Kartını oyna, hocayla karşılaştır.</p>
    </div>
    <div class="fan" id="fan"></div>
    <div class="home-actions">
      <button class="btn ghost" id="bHow">Nasıl oynanır</button>
      <button class="btn" id="bPlay">Maç seç</button>
    </div>
  </section>

  <section class="screen" id="list" hidden>
    <div class="top-bar"><h2 class="disp">Maçlar</h2><span class="lbl" style="opacity:.85">Flix Ligi · 9. Hafta</span></div>
    <div class="matches" id="matches"></div>
    <div class="list-foot row-end"><button class="btn ghost" id="bBack">Geri</button></div>
  </section>

  <section class="screen" id="match" hidden>
    <div class="board" id="board"></div>
    <div class="feed" id="feed"></div>
    <div class="sit" id="sit"></div>
    <div class="pitch" id="pitch"></div>
    <div class="hand" id="hand"></div>
    <div class="act">
      <div class="timer"><div class="bar"><i id="tbar"></i></div><span id="tlbl">30 sn</span></div>
      <button class="btn" id="bDecide" disabled>Kararı ver</button>
    </div>
  </section>

  <section class="screen" id="final" hidden></section>

const $=s=>document.querySelector(s);
const rngF=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const hash=str=>{let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let audio=null;
function beep(f=660,d=.08,type='square',v=.05){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d+.02);}catch(e){}}
function whistle(){beep(2300,.18,'sine',.06);setTimeout(()=>beep(2500,.32,'sine',.06),200);}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

 {id:'sondakika',title:'Son Dakika',home:'FRT',away:'KRT',you:'h',moments:[46,60,75,85],
  tag:'Zor',note:'Golsüz bir maç. Rakip savunmada çok kalabalık.',

];
const teamOf=(sc,s)=>(s==='y')===(sc.you==='h')?sc.home:sc.away;
const P=(sc,s,i)=>squad(teamOf(sc,s))[i];

/* gerçek maç durumunu belirli bir dakikaya kadar kur */
function stateAt(sc,m){
  const st={m,gy:0,go:0,on:{y:[...Array(11).keys()].map(i=>({i,e:0})),o:[...Array(11).keys()].map(i=>({i,e:0}))},
    used:{y:new Set(),o:new Set()},subs:{y:0,o:0},yc:{y:new Set(),o:new Set()},goals:{y:{},o:{}},ast:{y:{},o:{}},past:[]};
  for(const e of sc.ev){
    if(e.m>=m)break;
    st.past.push(e);
    if(e.t==='g'){ e.s==='y'?st.gy++:st.go++; st.goals[e.s][e.p]=(st.goals[e.s][e.p]||0)+1; if(e.a!=null)st.ast[e.s][e.a]=(st.ast[e.s][e.a]||0)+1; }
    if(e.t==='y')st.yc[e.s].add(e.p);
    if(e.t==='r'){ const k=st.on[e.s].findIndex(x=>x&&x.i===e.p); if(k>=0)st.on[e.s][k]=null; }
    if(e.t==='s'){ const k=st.on[e.s].findIndex(x=>x&&x.i===e.o); if(k>=0){st.on[e.s][k]={i:e.i,e:e.m};} st.used[e.s].add(e.i); st.used[e.s].add(e.o); st.subs[e.s]++; }
  }
  return st;
}
const staOf=(sc,s,slot,m)=>{ const p=P(sc,s,slot.i); const rate=(s==='y'&&sc.rate[slot.i])||p.rate; return clamp(100-rate*(m-slot.e),18,100); };
function noteOf(sc,st,s,slot){
  const p=P(sc,s,slot.i), f=(s==='y'&&sc.form[slot.i])||0;
  let n=6.25+p.noise+f*1.1+(st.goals[s][slot.i]||0)*1.1+(st.ast[s][slot.i]||0)*.6-(st.yc[s].has(slot.i)?.3:0);
  if(slot.e>0)n=6.4+p.noise*.5+(st.goals[s][slot.i]||0)*1.1+(st.ast[s][slot.i]||0)*.6;
  if(staOf(sc,s,slot,st.m)<45)n-=.3;
  return clamp(n,4.5,9.9);
}

/* ---------- maç motoru: dakikalık gol olasılığı, aynı rastgele sayılarla karşılaştırmalı simülasyon ---------- */
const WA={G:0,D:.15,M:.35,A:.5}, WD={G:.5,D:.4,M:.25,A:.05};
function strength(sc,s,on,m){
  let a=0,d=0;
  for(const sl of on){ if(!sl)continue; const p=P(sc,s,sl.i); const f=.58+.42*staOf(sc,s,sl,m)/100;
    const fm=1+((s==='y'&&sc.form[sl.i])||0)*.09, bo=(s==='y'&&sc.boost[sl.i])||0;
    a+=(p.att+bo)*f*fm*WA[p.g]; d+=(p.def+bo*.3)*f*fm*WD[p.g]; }
  return {a:a/3.15,d:d/3.0};
}
/* plan: {subs:{y:[{m,o,i}],o:[...]}, tac:[{m,v}]} */
function lambdas(sc,st,plan){
  const on={y:st.on.y.map(x=>x&&{...x}),o:st.on.o.map(x=>x&&{...x})};
  const ly=[],lo=[]; let tac=0; const home=sc.you==='h';
  for(let m=st.m;m<=90;m++){
    for(const s of ['y','o'])for(const sb of plan.subs[s])if(sb.m===m){ const k=on[s].findIndex(x=>x&&x.i===sb.o); if(k>=0)on[s][k]={i:sb.i,e:m}; }
    for(const t of plan.tac)if(t.m===m)tac=t.v;
    const Y=strength(sc,'y',on.y,m),O=strength(sc,'o',on.o,m);
    const base=1.5/90;
    let a=base*Math.pow(Y.a/O.d,4)*(home?1.08:.94), b=base*Math.pow(O.a/Y.d,4)*(home?.94:1.08);
    if(tac===1){a*=1.16;b*=1.12;} else if(tac===-1){a*=.78;b*=.82;}
    ly.push(a);lo.push(b);
  }
  return {ly,lo};
}
function simulate(st,L,n=2400,seed=7){
  let w=0,d=0,l=0,sy=0,so=0; const res={};
  for(let k=0;k<n;k++){ const r=rngF(seed*7919+k); let gy=st.gy,go=st.go;
    for(let t=0;t<L.ly.length;t++){ if(r()<L.ly[t])gy++; if(r()<L.lo[t])go++; }
    if(gy>go)w++;else if(gy===go)d++;else l++; sy+=gy;so+=go; const key=gy+'-'+go; res[key]=(res[key]||0)+1; }
  let best='',bc=-1; for(const k in res)if(res[k]>bc){bc=res[k];best=k;}
  return {w:w/n,d:d/n,l:l/n,ep:(3*w+d)/n,likely:best};
}

/* ---------- karar seçenekleri ---------- */
function coachDecision(sc,k){
  const m0=sc.moments[k],m1=k+1<sc.moments.length?sc.moments[k+1]:91;
  const subs=sc.ev.filter(e=>e.t==='s'&&e.s==='y'&&e.m>=m0&&e.m<m1).map(e=>({m:e.m,o:e.o,i:e.i}));
  return subs.length?{kind:'sub',subs,coach:1}:{kind:'wait',coach:1};
}
const sig=d=>d.kind==='sub'?'s'+d.subs.map(x=>x.o+'>'+x.i).sort().join(','):d.kind==='tac'?'t'+d.v:'w';
function needScore(sc,st,sl){ const p=P(sc,'y',sl.i); if(p.g==='G')return -99;
  return (100-staOf(sc,'y',sl,st.m))*.7+(7-noteOf(sc,st,'y',sl))*14+(st.yc.y.has(sl.i)&&p.g!=='A'?14:0)-(st.goals.y[sl.i]||0)*10; }
function benchOf(sc,st){ return [...Array(7).keys()].map(x=>x+11).filter(i=>!st.used.y.has(i)); }
function options(sc,st,k){
  const out=[],seen=new Set(),add=d=>{const s=sig(d);if(!seen.has(s)){seen.add(s);out.push(d);}};
  const coach=coachDecision(sc,k), left=5-st.subs.y, bench=benchOf(sc,st);
  const onP=st.on.y.filter(Boolean).filter(sl=>P(sc,'y',sl.i).g!=='G').sort((a,b)=>needScore(sc,st,b)-needScore(sc,st,a));
  const diff=st.gy-st.go, M=st.m;
  const pick=(grps,excl)=>bench.filter(i=>!excl.includes(i)&&grps.includes(P(sc,'y',i).g)&&P(sc,'y',i).g!=='G').sort((a,b)=>ovr(P(sc,'y',b))+((sc.boost[b]||0))-ovr(P(sc,'y',a))-((sc.boost[a]||0)))[0];
  const cards=[];
  if(left>0&&onP.length&&bench.length){
    const w=onP[0], g=P(sc,'y',w.i).g; const inn=pick([g],[])??pick(['D','M','A'],[]);
    if(inn!=null)cards.push({kind:'sub',subs:[{m:M,o:w.i,i:inn}],why:'Yorgun / formsuz'});
    if(diff<0||(diff===0&&M>=70)){ const o=onP.find(sl=>P(sc,'y',sl.i).g!=='A'&&sl!==w)||onP[1]; const i2=pick(['A'],[inn]); if(o&&i2!=null)cards.push({kind:'sub',subs:[{m:M,o:o.i,i:i2}],why:'Hücum değişikliği'}); }
    else if(diff>0){ const o=onP.find(sl=>P(sc,'y',sl.i).g==='A'&&sl!==w)||onP[1]; const i2=pick(['D','M'],[inn]); if(o&&i2!=null)cards.push({kind:'sub',subs:[{m:M,o:o.i,i:i2}],why:'Skoru koru'}); }
    else { const o=onP[1]; const i2=o&&pick([P(sc,'y',o.i).g],[inn]); if(o&&i2!=null)cards.push({kind:'sub',subs:[{m:M,o:o.i,i:i2}],why:'Taze kan'}); }
  }
  if(coach.kind==='sub')cards.push(coach);
  cards.push(diff>0&&M>=60?{kind:'tac',v:-1}:{kind:'tac',v:1});
  // karıştır (hocanın kartı hep aynı yerde olmasın)
  const r=rngF(hash(sc.id+k));
  for(let i=cards.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}
  cards.forEach(add); add({kind:'wait'});
  return out;
}

/* ---------- değerlendirme ---------- */
function laterReal(sc,m){ return sc.ev.filter(e=>e.m>=m); }
function planFor(sc,st,dec,coachMode){
  const subs={y:[],o:sc.ev.filter(e=>e.t==='s'&&e.s==='o'&&e.m>=st.m).map(e=>({m:e.m,o:e.o,i:e.i}))},tac=[];
  if(dec.kind==='sub')for(const x of dec.subs)subs.y.push({m:coachMode?x.m:st.m,o:x.o,i:x.i});
  if(dec.kind==='tac')tac.push({m:st.m,v:dec.v});
  return {subs,tac};
}
function evaluate(sc,k,dec){
  const st=stateAt(sc,sc.moments[k]), coach=coachDecision(sc,k);
  const su=simulate(st,lambdas(sc,st,planFor(sc,st,dec,false)),2400,k+3);
  const scz=simulate(st,lambdas(sc,st,planFor(sc,st,coach,true)),2400,k+3);
  const delta=su.ep-scz.ep;
  const simPts=Math.round(clamp(30+delta*170,0,60));
  const lines=[]; let real=20;
  const same=sig(dec)===sig(coach);
  const later=laterReal(sc,st.m).filter(e=>e.s==='y');
  const contrib=i=>later.filter(e=>e.t==='g'&&(e.p===i||e.a===i));
  const nm=i=>P(sc,'y',i).short;
  if(same){ real+=6; lines.push(['Hocayla aynı kararı verdin.',6]); }
  else{
    if(dec.kind==='sub')for(const x of dec.subs){
      for(const g of contrib(x.o)){ real-=12; lines.push([`Çıkardığın ${nm(x.o)}, gerçekte ${g.m}'de ${g.p===x.o?'gol attı':'asist yaptı'}.`,-12]); }
      const red=later.find(e=>e.t==='r'&&e.p===x.o); if(red){ real+=16; lines.push([`${nm(x.o)} gerçekte ${red.m}'de kırmızı gördü. Sen onu çoktan oyundan almıştın.`,16]); }
      const cin=coach.kind==='sub'&&coach.subs.find(c=>c.i===x.i);
      for(const g of contrib(x.i)){ real+=10; lines.push([`Aldığın ${nm(x.i)} gerçekte ${g.m}'de ${g.p===x.i?'gol attı':'asist yaptı'}${cin?', sen daha erken soktun':''}.`,10]); }
    }
    if(coach.kind==='sub')for(const c of coach.subs){
      if(dec.kind==='sub'&&dec.subs.some(x=>x.i===c.i))continue;
      for(const g of contrib(c.i)){ real-=8; lines.push([`Hocanın ${c.m}'de aldığı ${nm(c.i)}, ${g.m}'de ${g.p===c.i?'gol attı':'asist yaptı'}.`,-8]); }
    }
    if(dec.kind==='wait'&&coach.kind==='wait'){ real+=5; lines.push(['Hoca da bekledi.',5]); }
    const red=later.find(e=>e.t==='r'&&e.m<(k+1<sc.moments.length?sc.moments[k+1]:91));
    if(red&&st.yc.y.has(red.p)&&!(dec.kind==='sub'&&dec.subs.some(x=>x.o===red.p))){ real-=6; lines.push([`Sarı kartlı ${nm(red.p)} sahada kaldı ve ${red.m}'de atıldı.`,-6]); }
  }
  real=clamp(real,0,40);
  return {st,coach,dec,su,sc:scz,simPts,realPts:real,lines,total:simPts+real,same,delta};
}
function fullAlt(sc,decs){
  const st=stateAt(sc,sc.moments[0]);
  const subs={y:[],o:sc.ev.filter(e=>e.t==='s'&&e.s==='o'&&e.m>=st.m).map(e=>({m:e.m,o:e.o,i:e.i}))},tac=[];
  decs.forEach((d,k)=>{ const m=sc.moments[k]; if(d.kind==='sub')d.subs.forEach(x=>subs.y.push({m,o:x.o,i:x.i})); if(d.kind==='tac')tac.push({m,v:d.v}); });
  const coach={y:sc.ev.filter(e=>e.t==='s'&&e.s==='y'&&e.m>=st.m).map(e=>({m:e.m,o:e.o,i:e.i})),o:subs.o};
  return {me:simulate(st,lambdas(sc,st,{subs,tac}),3000,99),coach:simulate(st,lambdas(sc,st,{subs:coach,tac:[]}),3000,99)};
}

  const sc=G.sc,k=G.k,m=sc.moments[k],st=stateAt(sc,m); G.st=st; G.sel=null; G.custom=null; G.outSel=null; G.hint='';
  board(st);
  $('#feed').innerHTML=st.past.slice().reverse().map(e=>evHTML(sc,e,e.t==='g'?scoreAfter(sc,e):'')).join('')||'<div class="ev">Maç başladı</div>';
  pitch(); hand();
  $('#bDecide').disabled=true; $('#bDecide').textContent='Kararı ver';
  clearInterval(timer); let left=30; const T=$('#tbar');
  T.style.transition='none'; T.style.transform='scaleX(1)'; void T.offsetWidth; T.style.transition='transform 30s linear'; T.style.transform='scaleX(0)';
  $('#tlbl').textContent=`Karar ${k+1}/${sc.moments.length} · 30 sn`;
  timer=setInterval(()=>{ left--; $('#tlbl').textContent=`Karar ${k+1}/${sc.moments.length} · ${left} sn`; if(left<=5&&left>0)beep(880,.05);
    if(left<=0){ clearInterval(timer); if(!G.sel){ G.sel={kind:'wait'}; } decide(); } },1000);
  toast(`${m}'`);
}
function situation(st){
  const sc=G.sc,diff=st.gy-st.go,chips=[];
  chips.push(['',diff>0?`${diff} gol öndesin`:diff<0?`${-diff} gol geridesin`:'Skor eşit']);
  const left=5-st.subs.y; chips.push(['',`${left} değişiklik hakkı`]);
  const men=st.on.y.filter(Boolean).length; if(men<11)chips.push(['warn',`${men} kişisin`]);
  st.on.y.forEach(sl=>{ if(!sl)return; const p=P(sc,'y',sl.i); if(st.yc.y.has(sl.i))chips.push(['warn',`${p.num} numara sarı kartlı`]); });
  const tired=st.on.y.filter(sl=>sl&&staOf(sc,'y',sl,st.m)<50).length; if(tired)chips.push(['warn',`${tired} oyuncun yorgun`]);
  const ot=st.on.o.filter(sl=>sl&&staOf(sc,'o',sl,st.m)<50).length, omen=st.on.o.filter(Boolean).length;
  if(omen<11)chips.push(['',`Rakip ${omen} kişi`]); if(ot)chips.push(['',`Rakipte ${ot} yorgun`]);
  return chips.map(([c,t])=>`<span class="chip ${c}">${t}</span>`).join('');
}
function pitch(){
  const sc=G.sc,st=G.st,el=$('#pitch'); const T=teamOf(sc,'y');
  const outs=new Set(G.sel&&G.sel.kind==='sub'?G.sel.subs.map(x=>x.o):[]);
  let h=`<svg class="lines" viewBox="0 0 100 150" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="#15215c" stroke-width=".9" opacity=".9">
    <rect x="4" y="4" width="92" height="142"/><line x1="4" y1="75" x2="96" y2="75"/><circle cx="50" cy="75" r="12"/>
    <rect x="24" y="4" width="52" height="20"/><rect x="38" y="4" width="24" height="8"/><rect x="24" y="126" width="52" height="20"/><rect x="38" y="138" width="24" height="8"/></g></svg>`;
  $('#sit').innerHTML=(G.hint?`<span class="chip warn">${G.hint}</span>`:'')+situation(st);
  const TO=teamOf(sc,'o');
  st.on.o.forEach((sl,k)=>{ if(!sl)return; const p=P(sc,'o',sl.i),sta=staOf(sc,'o',sl,st.m),[x,y]=SLOT_O[k];
    h+=`<button class="tok opp" style="left:${x}%;top:${y}%" data-o="${sl.i}" aria-label="${esc(p.name)}">${kitSVG(TO,p.num)}
      <span class="note">${noteOf(sc,st,'o',sl).toFixed(1)}</span>${st.yc.o.has(sl.i)?'<span class="ycd"></span>':''}
      <span class="sta"><i class="${sta<50?'low':''}" style="width:${sta}%"></i></span></button>`; });
  st.on.y.forEach((sl,k)=>{ if(!sl)return; const p=P(sc,'y',sl.i),sta=staOf(sc,'y',sl,st.m),[x,y]=SLOT[k];
    const cls=(outs.has(sl.i)?' out':'')+(G.outSel===sl.i?' sel':'');
    h+=`<button class="tok${cls}" style="left:${x}%;top:${y}%" data-i="${sl.i}" aria-label="${esc(p.name)}">${kitSVG(T,p.num)}
      <span class="note">${noteOf(sc,st,'y',sl).toFixed(1)}</span>${st.yc.y.has(sl.i)?'<span class="ycd"></span>':''}
      <span class="nm">${esc(p.short.split(' ').slice(1).join(' '))}</span><span class="sta"><i class="${sta<50?'low':''}" style="width:${sta}%"></i></span></button>`; });
  el.innerHTML=h; el.classList.toggle('compact',el.clientHeight<460);
  el.querySelectorAll('.tok:not(.opp)').forEach(b=>b.onclick=()=>playerSheet(+b.dataset.i));
  el.querySelectorAll('.tok.opp').forEach(b=>b.onclick=()=>oppSheet(+b.dataset.o));
}
function hand(){
  const sc=G.sc,st=G.st,box=$('#hand'); box.innerHTML='';
  G.opts=options(sc,st,G.k); if(G.custom)G.opts.unshift(G.custom);
  G.opts.forEach(d=>{ const el=cardEl(sc,st,d,st.m); if(G.sel&&sig(G.sel)===sig(d))el.classList.add('on');
    el.onclick=()=>{ G.sel=(G.sel&&sig(G.sel)===sig(d))?null:d; beep(G.sel?620:400,.05); buzz(8); $('#bDecide').disabled=!G.sel; hand(); pitch(); }; box.appendChild(el); });
  if(5-st.subs.y>0){ const mk=document.createElement('button'); mk.className='pcard make'; mk.type='button';
    mk.innerHTML='<div class="big">Kendi kartın</div><div class="txt" style="color:#fff">Sahadan bir oyuncuya dokun, yerine kimin gireceğini seç.</div>';
    mk.onclick=()=>{ G.hint='Çıkacak oyuncuna dokun'; pitch(); $('#pitch').animate([{transform:'scale(1)'},{transform:'scale(1.02)'},{transform:'scale(1)'}],{duration:300}); };
    box.appendChild(mk); }
}
function playerSheet(i){
  const sc=G.sc,st=G.st,p=P(sc,'y',i),sl=st.on.y.find(x=>x&&x.i===i),T=teamOf(sc,'y');
  G.outSel=i; pitch();
  const left=5-st.subs.y, bench=benchOf(sc,st);
  const sh=document.createElement('div'); sh.className='sheet';
  sh.innerHTML=`<div class="panel"><div class="pinfo">${kitSVG(T,p.num)}<div><h3 class="disp">${esc(p.name)}</h3><div>${POSNAME[p.pos]} · ${TEAMS[T].name}</div></div></div>
    <div class="stats"><div class="stat"><b>${ovr(p)}</b><span>Güç</span></div><div class="stat"><b>${noteOf(sc,st,'y',sl).toFixed(1)}</b><span>Maç notu</span></div>
    <div class="stat"><b>%${Math.round(staOf(sc,'y',sl,st.m))}</b><span>Kondisyon</span></div><div class="stat"><b>${(st.goals.y[i]||0)}/${(st.ast.y[i]||0)}</b><span>Gol/Asist</span></div></div>
    ${p.g==='G'?'<div class="lbl" style="opacity:.8">Kaleci değişikliği bu sürümde yok.</div>':left>0?`<div class="lbl" style="color:var(--yellow)">Yerine kim girsin?</div><div class="bench">${bench.map(b=>{const q=P(sc,'y',b);
      return `<button class="bp" data-b="${b}" ${q.g==='G'?'disabled':''}>${kitSVG(T,q.num)}<div><div style="font-weight:700">${esc(q.name)}</div><small>${POSNAME[q.pos]}${sc.boost[b]?' · formda':''}</small></div><b>${ovr(q)+(sc.boost[b]||0)}</b></button>`;}).join('')}</div>`:'<div class="lbl">Değişiklik hakkın bitti.</div>'}
    <div class="row-end"><button class="btn ghost" data-x="1">Kapat</button></div></div>`;
  sh.onclick=e=>{ if(e.target===sh||e.target.closest('[data-x]')){ sh.remove(); G.outSel=null; pitch(); } };
  sh.querySelectorAll('.bp').forEach(b=>b.onclick=()=>{ const d={kind:'sub',subs:[{m:st.m,o:i,i:+b.dataset.b}],mine:1};
    G.custom=d; G.sel=d; G.outSel=null; sh.remove(); beep(700,.06); buzz(10); $('#bDecide').disabled=false; G.hint='Kartın hazır, kararı ver'; hand(); pitch(); $('#hand').scrollTo({left:0,behavior:'smooth'}); });
  $('#app').appendChild(sh);
}
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; $('#app').appendChild(d); setTimeout(()=>d.remove(),950); }

function decide(){
  if(!G.sel)return; clearInterval(timer); whistle(); buzz([20,40,20]);
  const sc=G.sc,k=G.k,r=evaluate(sc,k,G.sel); G.decs.push(G.sel); G.res.push(r);
  const m1=k+1<sc.moments.length?sc.moments[k+1]:91;
  const evs=sc.ev.filter(e=>e.m>=sc.moments[k]&&e.m<m1);
  const pct=x=>Math.round(x*100);
  const sh=document.createElement('div'); sh.className='sheet reveal';
  const cdec=r.coach.kind==='sub'?r.coach:{kind:'wait'};
  const cardHTML=(d,tm)=>cardEl(sc,r.st,d,r.st.m,tm).outerHTML;
  sh.innerHTML=`<div class="panel">
    <h3 class="disp">Gerçekte ne oldu?</h3>
    <div class="vs"><div class="col"><div class="lbl">Senin kararın</div>${cardHTML(G.sel,r.st.m)}</div>
      <div class="col"><div class="lbl">Hocanın kararı</div>${cardHTML(cdec,cdec.kind==='sub'?cdec.subs.map(x=>x.m).join(', '):null)}</div></div>
    ${r.same?'<div class="same">Hocayla aynı düşündün.</div>':''}
    <div class="lbl" style="opacity:.8">${sc.moments[k]}' – ${m1>90?'90':m1}' arası maç</div>
    <div class="evlist">${evs.map(e=>evHTML(sc,e,e.t==='g'?scoreAfter(sc,e):'')).join('')||'<div class="ev">Önemli bir olay olmadı.</div>'}</div>
    <div class="lbl" style="opacity:.8">Bu andan maç sonuna kazanma ihtimali</div>
    <div class="prob"><span>Sen</span><span class="bar"><i style="width:${pct(r.su.w)}%"></i></span><b>%${pct(r.su.w)}</b></div>
    <div class="prob"><span>Hoca</span><span class="bar"><i class="c" style="width:${pct(r.sc.w)}%"></i></span><b>%${pct(r.sc.w)}</b></div>
    <div class="pts">
      <div class="pt"><span>Simülasyon: beklenen puan ${r.su.ep.toFixed(2)} (hoca ${r.sc.ep.toFixed(2)})</span><b class="${r.simPts>=30?'plus':'minus'}">${r.simPts}/60</b></div>
      ${r.lines.map(([t,v])=>`<div class="pt"><span>${esc(t)}</span><b class="${v>=0?'plus':'minus'}">${v>0?'+':''}${v}</b></div>`).join('')}
      <div class="pt"><span>Gerçekle sağlama</span><b>${r.realPts}/40</b></div>
    </div>
    <div class="total"><span class="lbl">Karar puanı</span><b>${r.total}</b></div>
    <div class="row-end"><button class="btn" data-n="1">${k+1<sc.moments.length?'Devam':'Maç sonu'}</button></div></div>`;
  sh.querySelector('[data-n]').onclick=()=>{ sh.remove(); beep(520); G.k++; if(G.k<sc.moments.length)moment(); else final(); };
  $('#app').appendChild(sh);
  if(r.total>=75)setTimeout(()=>toast('Süper karar'),200);
}
function final(){
  const sc=G.sc,st=stateAt(sc,91),total=G.res.reduce((a,r)=>a+r.total,0),gr=grade(total);
  const alt=fullAlt(sc,G.decs), pct=x=>Math.round(x*100);
  const prev=SAVE.best[sc.id]; if(prev==null||total>prev)SAVE.best[sc.id]=total; SAVE.plays++; persist();
  const gh=sc.you==='h'?st.gy:st.go,ga=sc.you==='h'?st.go:st.gy;
  const [ly,lo]=alt.me.likely.split('-'); const lh=sc.you==='h'?ly:lo,la=sc.you==='h'?lo:ly;
  const el=$('#final'); show('final');
  el.innerHTML=`<div class="fscore"><div class="lbl" style="color:var(--yellow)">Gerçek sonuç</div>
      <div class="teams">${kitSVG(sc.home)}<b>${gh} - ${ga}</b>${kitSVG(sc.away)}</div>
      <div style="font-size:13px;opacity:.85">${TEAMS[sc.home].name} – ${TEAMS[sc.away].name}</div></div>
    <div class="stamp"><b>${gr}</b><span>${total}/400</span></div>
    <div class="fbox"><div class="lbl" style="color:var(--yellow)">Galibiyet ihtimali (${sc.moments[0]}'den itibaren)</div>
      <div class="prob"><span>Sen</span><span class="bar"><i style="width:${pct(alt.me.w)}%"></i></span><b>%${pct(alt.me.w)}</b></div>
      <div class="prob"><span>Hoca</span><span class="bar"><i class="c" style="width:${pct(alt.coach.w)}%"></i></span><b>%${pct(alt.coach.w)}</b></div>
      <div style="font-size:13px">En olası skor seninle: <b>${lh} - ${la}</b></div></div>
    <div class="fbox">${G.res.map((r,k)=>`<div class="mrow"><span class="m">${sc.moments[k]}'</span><span>${r.same?'Hocayla aynı':r.dec.kind==='wait'?'Bekledin':r.dec.kind==='tac'?(r.dec.v>0?'Hücuma geçtin':'Kapandın'):r.dec.subs.map(x=>esc(P(sc,'y',x.i).short)+' girdi').join(', ')}</span><b>${r.total}</b></div>`).join('')}</div>
    <div style="font-size:12.5px;opacity:.8;text-align:center">Kariyer: ${careerPts()} puan · ${rankOf(careerPts())}${prev!=null&&total>prev?' · Yeni rekor':''}</div>
    <div class="final-foot"><button class="btn ghost" id="fList">Maçlar</button><button class="btn" id="fAgain">Tekrar oyna</button></div>`;
  $('#fList').onclick=()=>{beep(400);list();}; $('#fAgain').onclick=()=>{beep(520);startMatch(sc);};
  whistle(); setTimeout(whistle,450);
}
function how(){
  const sh=document.createElement('div'); sh.className='sheet'; sh.id='how';
  sh.innerHTML=`<div class="panel"><h3 class="disp">Nasıl oynanır</h3><ol>
   <li>Bir maç seç. Maç, kulübenin karar verdiği anlara bölünmüş halde gelir.</li>
   <li>Her anda elindeki kartlardan birini oyna: değişiklik, taktik ya da bekle. Sahadaki bir oyuncuya dokunup kendi değişikliğini de yapabilirsin. 30 saniyen var.</li>
   <li>Kart açılınca hocanın gerçekte ne yaptığını ve maçta ne olduğunu görürsün.</li>
   <li>Puan iki parçadır: kararınla ve hocanın kararıyla maçın kalanı binlerce kez simüle edilir (60 puan), sonra gerçekte olanlarla sağlama yapılır (40 puan).</li></ol>
   <p style="opacity:.8;font-size:12.5px">Takımlar, formalar ve oyuncular kurgusaldır. Gerçek kulüp ya da kişilerle bağlantısı yoktur.</p>
   <div class="row-end"><button class="btn" data-x="1">Anladım</button></div></div>`;
  sh.onclick=e=>{ if(e.target===sh||e.target.closest('[data-x]'))sh.remove(); };
  $('#app').appendChild(sh);
}
$('#bPlay').onclick=()=>{beep(520);list();};
$('#bBack').onclick=()=>{beep(400);home();};
$('#bHow').onclick=()=>{beep(520);how();};
$('#bDecide').onclick=decide;
home();
</script>
</body></html>
