<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d81e27"><style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}</style></head><body><title>Flix Direktör</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800;1,900&family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: tek ekran oyun. Üstte bilgi, ortada akış, altta başparmak bölgesinde büyük butonlar (ana buton sağ altta). */
:root{
  --red:#d81e27; --red-deep:#b3141c; --navy:#15215c; --navy-deep:#0c1440; --yellow:#ffc72c;
  --paper:#fff4dc; --paper-edge:#f1dfb5; --ink:#15215c; --ok:#178a4a; --bad:#c8102e; --mute:#6b6f8c; --soft:rgba(255,255,255,.1);
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%;}
[hidden]{display:none!important;}
body{background:var(--red);color:#fff;font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
button,input{font:inherit;color:inherit;border:0;background:none;}
button{cursor:pointer;}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 14px;}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px;min-height:0;padding-bottom:4px;}
.disp{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;line-height:.95;letter-spacing:.01em;}
.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 24px;border-radius:14px;background:var(--yellow);color:var(--navy);font-family:var(--display);font-weight:800;font-style:italic;font-size:24px;text-transform:uppercase;border:3px solid var(--navy);box-shadow:0 5px 0 var(--navy);transition:transform .08s,box-shadow .08s;}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--navy);}
.btn[disabled]{opacity:.45;pointer-events:none;}
.btn.ghost{background:transparent;color:#fff;border-color:#fff;box-shadow:none;font-size:19px;min-height:48px;padding:0 16px;}
.btn.wide{width:100%;}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.foot .btn:last-child{margin-left:auto;}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;}
.top h2{margin:0;font-size:32px;text-shadow:2px 2px 0 var(--navy);}
.back{font-size:15px;font-weight:700;padding:8px 2px;}
.card{background:var(--paper);color:var(--ink);border:3px solid var(--navy);border-radius:14px;box-shadow:0 4px 0 var(--navy);}
.panel{background:var(--navy);border-radius:14px;padding:12px;border:2px solid var(--navy-deep);}
svg.kit{display:block;}
.y{display:inline-block;font-size:9.5px;font-weight:800;background:var(--yellow);color:var(--navy);border-radius:3px;padding:0 3px;margin-left:4px;vertical-align:1px;}

/* Ana ekran */
#home{justify-content:space-between;background:repeating-linear-gradient(180deg,var(--red) 0 46px,var(--red-deep) 46px 92px);}
.home-top{display:flex;justify-content:space-between;align-items:flex-start;}
.home-top img{width:86px;height:auto;filter:drop-shadow(0 3px 0 rgba(12,20,64,.35));}
.badge{background:var(--navy);border-radius:12px;padding:8px 12px;text-align:right;border:2px solid var(--navy-deep);}
.badge b{display:block;font-family:var(--display);font-style:italic;font-size:26px;color:var(--yellow);line-height:1;}
.badge span{font-size:11px;opacity:.85;}
.hero h1{font-size:clamp(64px,21vw,104px);margin:0;text-shadow:4px 4px 0 var(--navy);}
.hero h1 small{display:block;font-size:.42em;color:var(--yellow);text-shadow:3px 3px 0 var(--navy);margin-bottom:4px;}
.hero p{margin:12px 0 0;max-width:30ch;font-size:15px;line-height:1.45;}
.modes{display:flex;flex-direction:column;gap:10px;}
.mode{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;text-align:left;padding:12px 14px;}
.mode b{font-family:var(--display);font-style:italic;font-weight:900;font-size:28px;text-transform:uppercase;line-height:1;}
.mode span{display:block;font-size:12.5px;color:var(--mute);margin-top:2px;}
.mode i{font-style:normal;font-family:var(--display);font-weight:900;font-size:30px;}
.mode.main{background:var(--yellow);}
.mode.main span{color:#5a4a10;}

/* Sezon / takım seçimi */
.tabs{display:flex;gap:8px;}
.tab{flex:1;min-height:44px;border-radius:12px;border:2px solid #fff;font-family:var(--display);font-style:italic;font-weight:800;font-size:20px;}
.tab.on{background:#fff;color:var(--red);}
.team{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px 12px;}
.team svg{width:52px;height:52px;}
.team b{font-family:var(--display);font-style:italic;font-weight:900;font-size:25px;text-transform:uppercase;line-height:1;}
.team small{display:block;font-size:12px;color:var(--mute);margin-top:3px;line-height:1.3;}
.team .r{text-align:center;font-size:10px;font-weight:700;color:var(--mute);letter-spacing:.06em;}
.team .r em{display:block;font-style:normal;font-family:var(--display);font-weight:900;font-size:26px;color:var(--ink);letter-spacing:0;}

/* Hub */
.hubhead{display:flex;align-items:center;gap:12px;}
.hubhead svg{width:54px;height:54px;flex:none;}
.hubhead h2{margin:0;font-size:30px;text-shadow:2px 2px 0 var(--navy);}
.hubhead div span{font-size:13px;opacity:.9;}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.kpi{background:var(--navy);border-radius:12px;padding:8px;text-align:center;}
.kpi b{display:block;font-family:var(--display);font-style:italic;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--yellow);}
.kpi span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;}
.kpi b.plus{color:#7be3a6;} .kpi b.minus{color:#ffb0b0;}
.next{padding:12px;display:flex;flex-direction:column;gap:8px;}
.vsrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;}
.vsrow svg{width:46px;height:46px;margin:0 auto;}
.vsrow b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;text-transform:uppercase;margin-top:2px;}
.vsrow .mid{font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;}
.tbl td{padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.12);}
.tbl td:first-child{width:22px;opacity:.75;}
.tbl td.n{text-align:right;width:34px;}
.tbl tr.me td{color:var(--yellow);font-weight:700;}
.tbl .tk{display:flex;align-items:center;gap:6px;}
.tbl .tk svg{width:18px;height:18px;flex:none;}

/* Kadro */
.xi{display:flex;flex-direction:column;gap:6px;}
.pl{display:grid;grid-template-columns:38px 30px 1fr auto;gap:8px;align-items:center;text-align:left;background:var(--soft);border-radius:10px;padding:6px 10px;}
.pl .pos{font-size:11px;font-weight:800;color:var(--yellow);letter-spacing:.04em;}
.pl svg{width:30px;height:30px;}
.pl .nm{font-weight:600;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pl .nm small{display:block;font-weight:400;font-size:11px;opacity:.75;}
.pl b{font-family:var(--display);font-style:italic;font-size:22px;}
.pl.sel{background:var(--yellow);color:var(--navy);}
.pl.sel .pos{color:var(--navy);}
.cond{display:inline-block;width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);vertical-align:middle;margin-left:4px;overflow:hidden;}
.cond i{display:block;height:100%;background:#7be3a6;}
.cond i.mid{background:var(--yellow);} .cond i.low{background:#ff7b7b;}
.rule{background:var(--navy);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.4;}
.rule b{color:var(--yellow);}

/* Maç: üstte skorbord ve olay şeridi, ortada saha, altta kart eli; ana buton sağ altta */
#match{gap:7px;padding-top:8px;}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--navy);border:2px solid var(--navy-deep);border-radius:14px;padding:6px 10px;gap:8px;}
.bteam{display:flex;align-items:center;gap:6px;min-width:0;text-align:left;}
.bteam.r{justify-content:flex-end;text-align:right;}
.bteam svg{width:30px;height:30px;flex:none;}
.bteam span{font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.bteam small{display:block;font-family:var(--body);font-style:normal;font-weight:600;font-size:10px;letter-spacing:.04em;opacity:.75;text-transform:none;}
.bteam.me span{color:var(--yellow);}
.bscore{text-align:center;}
.bscore b{font-family:var(--display);font-style:italic;font-weight:900;font-size:36px;line-height:1;font-variant-numeric:tabular-nums;}
.bscore em{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--navy);background:var(--yellow);border-radius:4px;padding:0 6px;margin-top:2px;font-variant-numeric:tabular-nums;}
.feed{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-height:26px;flex:none;}
.feed::-webkit-scrollbar{display:none;}
.ev{flex:none;display:flex;align-items:center;gap:5px;background:rgba(12,20,64,.32);border-radius:8px;padding:4px 8px;font-size:12px;white-space:nowrap;animation:in .25s ease-out;}
.ev b{font-variant-numeric:tabular-nums;}
.ev.goal{background:var(--yellow);color:var(--navy);font-weight:700;}
.ev.me{background:var(--navy);}
@keyframes in{from{transform:translateX(-10px);opacity:0}to{transform:none;opacity:1}}
.ico{display:inline-block;flex:none;}
.ico.ball{width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--navy);}
.ico.sub{font-weight:800;font-size:12px;color:var(--yellow);}
.ev.goal .ico.sub{color:var(--navy);}
.pitch{position:relative;flex:1;min-height:190px;border:3px solid var(--navy);border-radius:10px;overflow:hidden;background:repeating-linear-gradient(180deg,#c4161f 0 12.5%,#b8121b 12.5% 25%);}
.pitch .lines{position:absolute;inset:0;width:100%;height:100%;}
.sit{position:absolute;left:8px;right:8px;top:8px;display:flex;flex-wrap:wrap;gap:5px;z-index:3;pointer-events:none;}
.chip{background:var(--navy);color:#fff;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;}
.chip.warn{background:var(--yellow);color:var(--navy);}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:70px;z-index:2;}
.tok svg{width:34px;height:34px;filter:drop-shadow(0 2px 0 rgba(12,20,64,.45));transition:transform .15s;}
.tok .nm{margin-top:1px;background:var(--navy);color:#fff;font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:4px;white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis;}
.tok .sta{width:40px;height:4px;background:rgba(12,20,64,.5);border-radius:2px;margin-top:2px;overflow:hidden;}
.tok .sta i{display:block;height:100%;background:#fff;}
.tok .sta i.low{background:var(--yellow);}
.tok .ov{position:absolute;top:-2px;left:8px;font-size:10px;font-weight:800;background:#fff;color:var(--navy);border-radius:4px;padding:0 3px;font-variant-numeric:tabular-nums;}
.tok .fl{position:absolute;top:-3px;right:9px;font-size:13px;line-height:1;}
.tok.out{opacity:.35;}
.tok.in svg{transform:scale(1.12);}
.tok.sel svg{transform:scale(1.18);}
.tok.sel .nm,.tok.in .nm{background:var(--yellow);color:var(--navy);}
.hint{text-align:center;font-size:11.5px;opacity:.9;margin-top:-2px;min-height:14px;}
.hand{display:flex;gap:10px;overflow-x:auto;padding:12px 4px 8px;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:166px;flex:none;}
.hand::-webkit-scrollbar{display:none;}
.pcard{flex:none;width:136px;min-height:146px;scroll-snap-align:start;background:var(--paper);color:var(--ink);border:3px solid var(--navy);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 4px 0 var(--navy);transition:transform .15s,box-shadow .15s;position:relative;animation:deal .3s cubic-bezier(.2,1.4,.4,1) backwards;}
.pcard:nth-child(2){animation-delay:.06s}.pcard:nth-child(3){animation-delay:.12s}.pcard:nth-child(4){animation-delay:.18s}
@keyframes deal{from{transform:translateY(50px) rotate(-6deg);opacity:0}}
.pcard:nth-child(odd){transform:rotate(-1.2deg);}
.pcard:nth-child(even){transform:rotate(1.2deg);}
.pcard.on{transform:translateY(-10px) rotate(0);box-shadow:0 10px 0 var(--navy);background:#fff;outline:3px solid var(--yellow);outline-offset:-7px;}
.pcard .kind{font-family:var(--display);font-style:italic;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px dashed var(--paper-edge);padding-bottom:4px;display:flex;justify-content:space-between;gap:4px;}
.pcard .kind i{font-style:normal;color:var(--mute);font-size:13px;white-space:nowrap;}
.prow{display:grid;grid-template-columns:14px 28px 1fr;gap:4px;align-items:center;}
.prow svg{width:28px;height:28px;}
.prow .arr{font-weight:900;font-size:14px;text-align:center;}
.prow .arr.dn{color:var(--bad);} .prow .arr.up{color:var(--ok);}
.prow .pn{font-size:12px;font-weight:700;line-height:1.15;min-width:0;overflow:hidden;}
.prow .pn small{display:block;font-weight:500;color:var(--mute);font-size:10.5px;white-space:nowrap;}
.pcard .big{font-family:var(--display);font-style:italic;font-weight:900;font-size:30px;text-transform:uppercase;line-height:.9;margin-top:4px;}
.pcard .txt{font-size:11.5px;line-height:1.35;color:#3a3f63;}
.pcard .fx{margin-top:auto;font-size:10.5px;font-weight:800;line-height:1.3;}
.fx .up{color:var(--ok);} .fx .dn{color:var(--bad);}
.pcard.make{background:transparent;border-style:dashed;border-color:var(--paper);color:#fff;box-shadow:none;justify-content:center;align-items:center;text-align:center;}
.pcard.make .big{font-size:24px;}
.pcard.make .txt{color:#fff;}
.pcard.live{width:100%;animation:none;transform:none;}
.pcard.live .big{font-size:40px;font-variant-numeric:tabular-nums;}
.act{display:flex;align-items:center;gap:12px;}
.timer{flex:1;min-width:0;}
.timer .bar{height:8px;background:rgba(12,20,64,.4);border-radius:4px;overflow:hidden;}
.timer .bar i{display:block;height:100%;background:var(--yellow);transform-origin:left;}
.timer span{font-size:12px;display:block;margin-top:4px;opacity:.9;}
/* Karar sonucu */
.prob{display:grid;grid-template-columns:minmax(0,1fr) 92px 42px;gap:8px;align-items:center;font-size:12.5px;}
.prob span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prob.mine span:first-child{color:var(--yellow);font-weight:700;}
.prob .bar{height:12px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;}
.prob .bar i{display:block;height:100%;background:#9aa6e6;}
.prob.mine .bar i{background:var(--yellow);}
.prob b{text-align:right;font-variant-numeric:tabular-nums;}
.total{display:flex;align-items:flex-end;justify-content:space-between;border-top:2px dashed rgba(255,255,255,.25);padding-top:8px;}
.total b{font-family:var(--display);font-style:italic;font-size:54px;line-height:.85;color:var(--yellow);font-variant-numeric:tabular-nums;}
.pinfo{display:flex;gap:12px;align-items:center;}
.pinfo svg{width:56px;height:56px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.stat{background:rgba(255,255,255,.08);border-radius:10px;padding:6px;text-align:center;}
.stat b{display:block;font-family:var(--display);font-style:italic;font-size:22px;font-variant-numeric:tabular-nums;}
.stat span{font-size:10px;opacity:.8;letter-spacing:.06em;text-transform:uppercase;}
.bp{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--paper);color:var(--ink);border-radius:10px;padding:6px 10px;text-align:left;}
.bp svg{width:34px;height:34px;}
.bp b{font-family:var(--display);font-style:italic;font-size:22px;}
.bp small{display:block;color:var(--mute);font-size:11px;}
.bp[disabled]{opacity:.4;}
.bp.ro{background:rgba(255,255,255,.08);color:#fff;}
.bp.ro small{color:rgba(255,255,255,.7);}

/* Transfer */
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none;}
.fchips button{flex:none;font-size:13px;font-weight:700;border:2px solid #fff;border-radius:999px;padding:5px 12px;}
.fchips button.on{background:#fff;color:var(--red);}
.pl.no{opacity:.5;}
.pl .pr{text-align:right;line-height:1;}
.pl .pr small{display:block;font-size:11px;font-weight:700;color:var(--yellow);margin-top:3px;white-space:nowrap;}
.trf{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:left;padding:10px 12px;}
.trf b{font-family:var(--display);font-style:italic;font-weight:900;font-size:24px;text-transform:uppercase;line-height:1;}
.trf span{display:block;font-size:12px;color:var(--mute);margin-top:2px;}
.trf i{font-style:normal;font-family:var(--display);font-weight:900;font-size:28px;}
.last{font-size:13px;line-height:1.4;border-top:2px dashed var(--paper-edge);padding-top:6px;}
.last b{font-variant-numeric:tabular-nums;}
.wk{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;font-size:12.5px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.1);}
.wk span:first-child{text-align:right;} .wk b{font-variant-numeric:tabular-nums;min-width:34px;text-align:center;}

/* Sonuç */
#result{background:var(--navy);}
.big{font-family:var(--display);font-style:italic;font-weight:900;font-size:76px;line-height:.9;text-align:center;font-variant-numeric:tabular-nums;}
.res-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;}
.res-teams svg{width:56px;height:56px;margin:0 auto;}
.res-teams .t{text-align:center;font-family:var(--display);font-style:italic;font-weight:800;font-size:17px;text-transform:uppercase;}
.verdict{align-self:center;font-family:var(--display);font-style:italic;font-weight:900;font-size:40px;color:var(--yellow);text-transform:uppercase;transform:rotate(-3deg);animation:stamp .35s cubic-bezier(.2,1.6,.4,1);}
@keyframes stamp{from{transform:scale(2) rotate(-12deg);opacity:0}to{transform:rotate(-3deg);opacity:1}}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cmp div{background:var(--soft);border-radius:12px;padding:10px;text-align:center;}
.cmp b{display:block;font-family:var(--display);font-style:italic;font-size:34px;font-variant-numeric:tabular-nums;}
.cmp span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.8;}
.gl{font-size:13px;line-height:1.6;opacity:.9;text-align:center;}
.stars{text-align:center;font-size:34px;letter-spacing:6px;color:var(--yellow);}
.stars i{font-style:normal;opacity:.25;}

/* Online */
.code{font-family:var(--display);font-style:italic;font-weight:900;font-size:58px;letter-spacing:.12em;text-align:center;color:var(--yellow);}
.inrow{display:flex;gap:8px;}
.inrow input{flex:1;min-width:0;background:#fff;color:var(--navy);border:3px solid var(--navy);border-radius:12px;padding:0 12px;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.15em;text-transform:uppercase;min-height:54px;user-select:text;-webkit-user-select:text;}
.duel{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;font-size:13px;}
.duel b{font-family:var(--display);font-style:italic;font-size:20px;text-align:right;}
.note{font-size:12.5px;opacity:.9;line-height:1.45;}
.sheet{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(12,20,64,.55);}
.sheet .in{background:var(--navy);border-top:3px solid var(--yellow);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));max-height:86%;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
.sheet h3{margin:0;font-size:28px;color:var(--yellow);}
.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--yellow);color:var(--navy);font-family:var(--display);font-style:italic;font-weight:900;font-size:64px;padding:4px 26px;border:4px solid var(--navy);border-radius:16px;z-index:30;text-transform:uppercase;animation:pop 1.1s ease-out forwards;pointer-events:none;white-space:nowrap;}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}20%{transform:translate(-50%,-50%) scale(1.1);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-62%);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>

/* ---------- yardımcılar ---------- */
const $=s=>document.querySelector(s);
const rngF=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const hash=str=>{let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let actx=null;
function beep(f=660,d=.08,type='square',v=.045){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.stop(actx.currentTime+d+.02);}catch(e){}}
const whistle=()=>{beep(2300,.16,'sine',.06);setTimeout(()=>beep(2500,.3,'sine',.06),190);};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function show(id){for(const s of document.querySelectorAll('.screen'))s.hidden=s.id!==id;document.querySelectorAll('.toast').forEach(t=>t.remove());}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('#app').appendChild(d);setTimeout(()=>d.remove(),1150);}

  const shirt='M12 4 L16.5 3 Q20 6.5 23.5 3 L28 4 L37.5 11.5 L33 17.5 L30 15.5 L30 37 L10 37 L10 15.5 L7 17.5 L2.5 11.5 Z';

  else if(type==='stripes')p+=[6,14,22,30].map(x=>`<rect x="${x}" width="4" height="40" fill="${c2}"/>`).join('');
  else if(type==='sleeves')p+=`<rect width="10.5" height="40" fill="${c2}"/><rect x="29.5" width="10.5" height="40" fill="${c2}"/>`;
  else if(type==='sash')p+=`<polygon points="8,0 17,0 34,40 25,40" fill="${c2}"/>`;

}

const STR={};
function strength(season,c){
  const k=season+c; if(STR[k])return STR[k];
  const R=RESULTS[season]; let gf=0,ga=0,n=0,tg=0,tn=0;
  for(const key in R.res){const [h,a]=key.split('-'),[x,y]=R.res[key];tg+=x+y;tn+=2;if(h===c){gf+=x;ga+=y;n++;}else if(a===c){gf+=y;ga+=x;n++;}}
  const avg=tg/tn, att=(gf/n)/avg, def=(ga/n)/avg;
  return STR[k]={att,def,q:clamp((att/def-0.6)/1.6,0,1)};
}

const valOf=(p,cond)=>p.ovr*(0.75+0.25*((cond&&cond[p.id])??100)/100);
function bestXI(list,cond){
  const xi=Array(11).fill(null),used=new Set();
  for(const s of FILL){const ok=SLOTS[s][1];
    const c=list.filter(p=>!used.has(p.id)&&ok.includes(p.pos)).sort((a,b)=>valOf(b,cond)-valOf(a,cond))[0]
      ||list.filter(p=>!used.has(p.id)&&(s===0?p.g==='G':p.g!=='G')).sort((a,b)=>valOf(b,cond)-valOf(a,cond))[0];
    xi[s]=c.id;used.add(c.id);}
  return xi;
}
function benchFor(list,xi,cond){
  const inXI=new Set(xi); let fc=foreignCount(list,xi);
  const rest=list.filter(p=>!inXI.has(p.id)).sort((a,b)=>valOf(b,cond)-valOf(a,cond)), bench=[];
  const gk=rest.find(p=>p.g==='G'&&(!p.y||fc<FOREIGN_MAX)); if(gk){bench.push(gk.id);if(gk.y)fc++;}
  for(const p of rest){if(bench.length>=7)break;if(bench.includes(p.id)||p.g==='G')continue;if(p.y&&fc>=FOREIGN_MAX)continue;bench.push(p.id);if(p.y)fc++;}
  return bench;
}
function foreignCount(list,ids){return ids.filter(id=>list.find(p=>p.id===id).y).length;}

/* ---------- maç motoru (tohumlu) ---------- */
const WA={G:0,D:.15,M:.35,A:.5},WD={G:.5,D:.4,M:.25,A:.05};
let DOM=1.45,FAT=.45,GBASE=1.18; // DOM: güçlü-zayıf farkını açar (Poisson ortalamaya çeker), FAT: yorgunluğun etkisi
function staOf(S,id,m){return clamp(S.sta0[id]-0.5*(m-(S.entry[id]||0)),25,100);}
function sideQ(S,m){
  let a=0,d=0;
  S.xi.forEach((id,k)=>{ if(!id)return; const p=S.P[id], f=1-FAT+FAT*staOf(S,id,m)/100;
    const off=SLOTS[k][1].includes(p.pos)?1:(k===0)!==(p.g==='G')?.5:.88;
    a+=p.att*f*WA[p.g]*off; d+=p.def*f*WD[p.g]*off; });
  return {a,d};
}
/* referans güç: kulübün gerçek kadrosunun en iyi 11'i. Zayıf 11 ya da transfer bu referansa göre etki eder */
const BASE={};
function baseOf(season,c){
  const k=season+c; if(BASE[k])return BASE[k];
  const list=squad(season,c),P={},sta0={}; list.forEach(p=>{P[p.id]=p;sta0[p.id]=100;});
  return BASE[k]=sideQ({xi:bestXI(list),P,sta0,entry:{}},0);
}
function makeSide(season,c,xi,bench,cond,list=squad(season,c)){
  const P={},sta0={};
  list.forEach(p=>{P[p.id]=p;sta0[p.id]=cond?100-(100-(cond[p.id]??100))*.5:100;}); // haftalık yorgunluğun yarısı maça taşınır
  return {c,xi:xi.slice(),bench:bench.slice(),P,sta0,entry:{},subs:5,tac:0,str:strength(season,c),base:baseOf(season,c)};
}
function lam(M,s,m){
  const A=M.sides[s],B=M.sides[s==='h'?'a':'h'],qa=sideQ(A,m),qb=sideQ(B,m);
  let l=(GBASE/90)*(s==='h'?1.1:.9)*Math.pow(A.str.att*B.str.def,DOM)*Math.pow(qa.a/A.base.a,3)*Math.pow(B.base.d/qb.d,3);
  if(A.tac===1)l*=1.25; if(A.tac===-1)l*=.72; if(B.tac===1)l*=1.18; if(B.tac===-1)l*=.78;
  return l;
}
function applyAct(M,s,act){
  const S=M.sides[s];
  if(act.k==='tac'){S.tac=act.v;return true;}
  if(act.k==='sub'){ const i=S.xi.indexOf(act.o); if(i<0||S.subs<=0||!S.bench.includes(act.i))return false;
    S.xi[i]=act.i; S.bench=S.bench.filter(x=>x!==act.i); S.entry[act.i]=M.m; S.sta0[act.i]=100; S.subs--; return true; }
  return false;
}
function cloneM(M){const C={...M,sides:{}};for(const s of ['h','a']){const S=M.sides[s];C.sides[s]={...S,xi:S.xi.slice(),bench:S.bench.slice(),sta0:{...S.sta0},entry:{...S.entry}};}return C;}
/* karar seçenekleri (en fazla 3) */
function choices(M,s){
  const S=M.sides[s],m=M.m,diff=(s==='h'?M.gh-M.ga:M.ga-M.gh),out=[];
  const onp=S.xi.map(id=>({id,p:S.P[id]})).filter(x=>x.p.g!=='G');
  const need=x=>(100-staOf(S,x.id,m))+(80-x.p.ovr)*1.5;
  onp.sort((a,b)=>need(b)-need(a));
  const bench=S.bench.map(id=>S.P[id]).filter(p=>p.g!=='G');
  const bestIn=(g,ex)=>bench.filter(p=>(!g||g.includes(p.g))&&!ex.includes(p.id)).sort((a,b)=>b.ovr-a.ovr)[0];
  if(S.subs>0&&bench.length){
    const w=onp[0], i1=bestIn([w.p.g],[])||bestIn(null,[]);
    if(i1)out.push({k:'sub',o:w.id,i:i1.id,t:'Taze güç',d:`${i1.short} girsin, ${w.p.short} çıksın`});
    if(diff<0||(diff===0&&m>=70)){ const o=onp.find(x=>x.p.g!=='A'&&x.id!==w.id); const i2=bestIn(['A'],[i1&&i1.id]); if(o&&i2)out.push({k:'sub',o:o.id,i:i2.id,t:'Gol için risk',d:`${i2.short} girsin, ${o.p.short} çıksın`}); }
    else if(diff>0&&m>=60){ const o=onp.find(x=>x.p.g==='A'&&x.id!==w.id); const i2=bestIn(['D','M'],[i1&&i1.id]); if(o&&i2)out.push({k:'sub',o:o.id,i:i2.id,t:'Skoru koru',d:`${i2.short} girsin, ${o.p.short} çıksın`}); }
  }
  if(out.length<2){ if(S.tac!==1&&diff<=0)out.push({k:'tac',v:1,t:'Hücuma geç',d:'Bekler ileri, baskı yukarı'});
    else if(S.tac!==-1&&diff>0)out.push({k:'tac',v:-1,t:'Kapan',d:'Bloklar geride, kontra bekle'});
    else out.push({k:'tac',v:0,t:'Dengeye dön',d:'Normal oyuna geç'}); }
  out.push({k:'wait',t:'Bekle',d:'Takım böyle devam etsin'});

}
function effect(M,s,act){
  if(act.k==='wait')return null;
  const o=s==='h'?'a':'h', l0=lam(M,s,M.m+5), r0=lam(M,o,M.m+5);
  const C=cloneM(M); applyAct(C,s,act);
  return {g:Math.round((lam(C,s,C.m+5)/l0-1)*100),r:Math.round((lam(C,o,C.m+5)/r0-1)*100)};
}
/* yapay zekâ hocası */
function aiActs(M,s){
  const m=M.m,diff=s==='h'?M.gh-M.ga:M.ga-M.gh,acts=[];
  if(m===60||m===72||m===82){ const sub=choices(M,s).find(x=>x.k==='sub'&&(diff<0||x.t!=='Gol için risk')); if(sub)acts.push(sub); }
  if(m===70){ if(diff<0)acts.push({k:'tac',v:1}); else if(diff>0)acts.push({k:'tac',v:-1}); }
  return acts;
}

function newMatch(o){
  // o: {season,h,a,you,seed,xi,bench,cond,lists,sideXI,replay:{side,acts}}
  const sides={};
  for(const s of ['h','a']){ const c=o[s], list=(o.lists&&o.lists[s])||squad(o.season,c), mine=o.you===s, cond=mine?o.cond:null;
    const xi=mine&&o.xi?o.xi:(o.sideXI&&o.sideXI[s])||bestXI(list,cond);
    const bench=mine&&o.bench?o.bench:benchFor(list,xi,cond);
    sides[s]=makeSide(o.season,c,xi,bench,cond,list); }
  return {o,sides,m:0,gh:0,ga:0,r:rngF(o.seed),acts:[],done:false,reactUsed:false,scorers:[]};
}
function pickScorer(M,s){
  const S=M.sides[s],w=S.xi.map(id=>{const p=S.P[id];return [p,{G:0,D:.4,M:1.3,A:3}[p.g]*(p.ovr/80)**3];});
  let t=w.reduce((a,b)=>a+b[1],0)*M.r(); for(const [p,x] of w){t-=x;if(t<=0)return p;} return w[0][0];
}
function step(M){
  M.m++; const ev=[];
  for(const s of ['h','a']){
    if(M.o.replay&&M.o.replay.side===s){ for(const a of M.o.replay.acts)if(a.m===M.m-1&&applyAct(M,s,a))ev.push({t:'act',s,a}); }
    else if(M.o.you!==s){ for(const a of aiActs(M,s))if(applyAct(M,s,a))ev.push({t:'act',s,a}); }
  }
  const lh=lam(M,'h',M.m),la=lam(M,'a',M.m),u1=M.r(),u2=M.r();
  if(u1<lh){M.gh++;ev.push({t:'goal',s:'h',p:pickScorer(M,'h')});} else if(u1<lh*3.2&&u1>lh*2.6)ev.push({t:'chance',s:'h',p:pickScorer(M,'h')});
  if(u2<la){M.ga++;ev.push({t:'goal',s:'a',p:pickScorer(M,'a')});} else if(u2<la*3.2&&u2>la*2.6)ev.push({t:'chance',s:'a',p:pickScorer(M,'a')});

function simToEnd(M){ while(!M.done){ step(M); const y=M.o.you; if(y&&!M.done)for(const a of aiActs(M,y))applyAct(M,y,a); } return M; }

const FX={};
function fixtures(season){
  if(FX[season])return FX[season];
  const t=RESULTS[season].teams.slice(); if(t.length%2)t.push(null); const n=t.length,rounds=[],arr=t.slice(1);
  for(let r=0;r<n-1;r++){ const cur=[t[0],...arr],ms=[];
    for(let i=0;i<n/2;i++){ let h=cur[i],a=cur[n-1-i]; if((r+i)%2)[h,a]=[a,h]; if(h&&a)ms.push([h,a]); }
    rounds.push(ms); arr.unshift(arr.pop()); }
  return FX[season]=rounds.concat(rounds.map(ms=>ms.map(([h,a])=>[a,h])));
}

/* puan tablosu: diğer bütün maçlar gerçek sonuç. Bizim maçımızda rakip de gerçekteki sonucunu alır, sadece bizim puanımız değişir */
function table(){
  const t={},fx=fixtures(ST.season),R=RESULTS[ST.season].res;
  RESULTS[ST.season].teams.forEach(c=>t[c]={c,p:0,gf:0,ga:0,pts:SEASONS[ST.season].ded[c]||0});
  const add=(c,f,g)=>{const T=t[c];T.p++;T.gf+=f;T.ga+=g;T.pts+=f>g?3:f===g?1:0;};
  for(let w=0;w<ST.week&&w<fx.length;w++)for(const [h,a] of fx[w]){ const real=R[h+'-'+a];
    if(h===ST.team||a===ST.team){ const my=ST.played[h+'-'+a]||real;
      if(h===ST.team){add(h,my[0],my[1]);add(a,real[1],real[0]);} else {add(h,real[0],real[1]);add(a,my[1],my[0]);} }
    else { add(h,real[0],real[1]); add(a,real[1],real[0]); } }
  return Object.values(t).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);
}
function realPtsTo(week){
  const fx=fixtures(ST.season),R=RESULTS[ST.season].res; let pts=0;
  for(let w=0;w<week;w++)for(const [h,a] of fx[w])if(h===ST.team||a===ST.team)pts+=ptsOf(h===ST.team?'h':'a',R[h+'-'+a]);
  return pts;
}
const trow=(r,tb)=>`<tr class="${r.c===ST.team?'me':''}"><td>${tb.indexOf(r)+1}</td><td><span class="tk">${kit(r.c)}${cname(r.c)}</span></td><td class="n">${r.p}</td><td class="n">${r.gf-r.ga>0?'+':''}${r.gf-r.ga}</td><td class="n"><b>${r.pts}</b></td></tr>`;
const money=v=>(Math.round(v*10)/10).toLocaleString('tr-TR')+' M€';
const priceOf=p=>Math.max(.3,Math.round(1.6*Math.pow(1.19,p.ovr-70)*10)/10);
const sellOf=p=>Math.round(priceOf(p)*.85*10)/10;
function trWindow(){ const H=fixtures(ST.season).length/2; return ST.week<3?'Yaz transfer dönemi':ST.week>=H-1&&ST.week<H+2?'Devre arası transfer dönemi':''; }
function hub(){
  initRoster(); show('hub'); const fx=fixtures(ST.season), total=fx.length;
  const tb=table(), pos=tb.findIndex(r=>r.c===ST.team)+1, me=tb.find(r=>r.c===ST.team);
  $('#hubSeason').textContent=`${SEASONS[ST.season].label} · Hafta ${Math.min(ST.week+1,total)}/${total}`;
  $('#hubHead').innerHTML=`${kit(ST.team)}<div><h2 class="disp">${cname(ST.team)}</h2><span>Hedef: şampiyonluk</span></div>`;
  const diff=(me.pts-(SEASONS[ST.season].ded[ST.team]||0))-realPtsTo(ST.week);
  $('#hubKpi').innerHTML=`<div class="kpi"><b>${pos}.</b><span>Sıra</span></div><div class="kpi"><b>${me.pts}</b><span>Puan</span></div><div class="kpi"><b class="${diff>0?'plus':diff<0?'minus':''}">${diff>0?'+':''}${diff}</b><span>Gerçeğe göre</span></div>`;
  const top=tb.slice(0,5); if(pos>5)top.push(me);
  $('#hubTable').innerHTML=top.map(r=>trow(r,tb)).join('');
  const win=trWindow();
  $('#hubTr').innerHTML=`<div><b>Transfer</b><span>Bütçe ${money(ST.budget)} · Kadro ${ST.roster.length} · ${win||'Pencere kapalı'}</span></div><i>›</i>`;
  const L=ST.last, last=L?`<div class="last">Geçen hafta ${cname(L.h)} – ${cname(L.a)}: sen <b>${L.my[0]}-${L.my[1]}</b>, gerçekte <b>${L.real[0]}-${L.real[1]}</b></div>`:'';
  if(ST.week>=total){ seasonEnd(tb,pos); return; }
  const m=fx[ST.week].find(([h,a])=>h===ST.team||a===ST.team);
  if(!m){ $('#hubNext').innerHTML=`<div class="lbl">Hafta ${ST.week+1}</div><div style="font-size:15px">Bu hafta maçın yok. Kadron dinleniyor.</div>${last}`;
    $('#hubPlay').textContent='Haftayı geç'; $('#hubSim').hidden=true; return; }
  const [h,a]=m; $('#hubPlay').textContent='Maça çık'; $('#hubSim').hidden=false;
  const tired=myList().filter(p=>(ST.cond[p.id]??100)<70).length;
  $('#hubNext').innerHTML=`<div class="foot"><span class="lbl">Hafta ${ST.week+1} · ${h===ST.team?'İç saha':'Deplasman'}</span><span class="lbl" style="color:var(--mute)">${tired?tired+' yorgun oyuncu':'Kadro hazır'}</span></div>
   <div class="vsrow"><div>${kit(h)}<b>${cname(h)}</b></div><div class="mid">VS</div><div>${kit(a)}<b>${cname(a)}</b></div></div>${last}`;
}
function weekDone(starters){
  const st=new Set(starters||[]);
  myList().forEach(p=>{const c=ST.cond[p.id]??100; ST.cond[p.id]=st.has(p.id)?clamp(c-9,55,100):clamp(c+20,55,100);});
  ST.week++; ST.n++; saveStory();
}
function weekOthers(w){
  const R=RESULTS[ST.season].res;
  return `<div class="panel"><div class="lbl" style="color:var(--yellow);margin-bottom:4px">Haftanın diğer maçları · gerçek skorlar</div>${fixtures(ST.season)[w].filter(([h,a])=>h!==ST.team&&a!==ST.team).map(([h,a])=>{const r=R[h+'-'+a];
    return `<div class="wk"><span>${cname(h)}</span><b>${r[0]}-${r[1]}</b><span>${cname(a)}</span></div>`;}).join('')}</div>`;
}
function playWeek(sim){
  const w=ST.week, m=fixtures(ST.season)[w].find(([h,a])=>h===ST.team||a===ST.team);
  if(!m){ weekDone([]); hub(); return; }
  const [h,a]=m, you=h===ST.team?'h':'a', opp=you==='h'?a:h, real=RESULTS[ST.season].res[h+'-'+a], list=myList();
  const xi=bestXI(list,ST.cond);
  const o={season:ST.season,h,a,you,seed:hash(ST.season+h+a+ST.n),xi,bench:benchFor(list,xi,ST.cond),cond:ST.cond,lists:{[you]:list,[you==='h'?'a':'h']:oppList(opp)}};
  const finish=M=>{ ST.played[h+'-'+a]=[M.gh,M.ga]; ST.last={h,a,my:[M.gh,M.ga],real}; weekDone(o.xi);
    resultScreen({M,real,title:`Hafta ${w+1} · ${SEASONS[ST.season].label}`,extra:weekOthers(w),onNext:hub}); };
  if(sim){ finish(simToEnd(newMatch(o))); return; }
  lineup(o,()=>playMatch(o,finish),hub);
}
function seasonEnd(tb,pos){
  const champ=pos===1; if(!ST.done){ST.done=true;saveStory();if(champ){setTimeout(()=>toast('Şampiyon'),200);whistle();}}
  $('#hubNext').innerHTML=`<div class="big" style="font-size:54px;color:${champ?'var(--ok)':'var(--ink)'}">${champ?'Şampiyon!':pos+'. oldun'}</div>
   <div style="text-align:center;font-size:14px">Gerçekte ${cname(ST.team)}: ${SEASONS[ST.season].real[ST.team]}</div>`;
  $('#hubPlay').textContent='Yeni sezon'; $('#hubSim').hidden=true;
}

/* ---------- transfer: sadece o sezonun Süper Lig kulüplerinden, bütçeyle ---------- */
let TR={tab:'buy',f:'all'};
const TRF=[['all','Hepsi'],['G','Kaleci'],['D','Defans'],['M','Orta saha'],['A','Forvet']];
function transfer(){ show('transfer'); renderTr(); }
function trCheck(p,buy){
  if(!trWindow())return 'Transfer penceresi kapalı. Yaz döneminde ilk 3 hafta, devre arasında 3 hafta açık.';
  const mine=myList();
  if(buy){ const seller=oppList(clubOf(p.id));
    if(ST.budget<priceOf(p))return 'Bütçen yetmiyor.';
    if(mine.length>=SQUAD_MAX)return `Kadro dolu (en fazla ${SQUAD_MAX}). Önce oyuncu sat.`;
    if(p.y&&mine.filter(x=>x.y).length>=LIST_FOREIGN)return `Kadroda en fazla ${LIST_FOREIGN} yabancı olabilir.`;
    if(seller.length<=SQUAD_MIN)return `${cname(clubOf(p.id))} daha fazla oyuncu satmıyor.`;
    if(p.g==='G'&&seller.filter(x=>x.g==='G').length<=2)return `${cname(clubOf(p.id))} kalecisini satmıyor.`;
  } else {
    if(mine.length<=SQUAD_MIN)return `Kadroda en az ${SQUAD_MIN} oyuncu kalmalı.`;
    if(p.g==='G'&&mine.filter(x=>x.g==='G').length<=2)return 'En az 2 kalecin kalmalı.';
  }
  return '';
}
function renderTr(){
  const mine=myList(), fc=mine.filter(p=>p.y).length, win=trWindow();
  $('#trKpi').innerHTML=`<div class="kpi"><b style="font-size:24px">${money(ST.budget)}</b><span>Bütçe</span></div><div class="kpi"><b>${mine.length}/${SQUAD_MAX}</b><span>Kadro</span></div><div class="kpi"><b>${fc}/${LIST_FOREIGN}</b><span>Yabancı</span></div>`;
  $('#trRule').innerHTML=win?`<b>${win} açık.</b> Sadece bu sezonun Süper Lig kulüplerinden alırsın. Sattığın oyuncu değerinin %85'ini getirir.`:`<b>Pencere kapalı.</b> Yaz döneminde ilk 3 hafta, devre arasında 3 hafta açık. Şimdi listeye göz atabilirsin.`;
  $('#trTabs').innerHTML=[['buy','Oyuncu al'],['sell','Oyuncu sat']].map(([k,t])=>`<button class="tab ${TR.tab===k?'on':''}" data-t="${k}">${t}</button>`).join('');
  $('#trF').innerHTML=TRF.map(([k,t])=>`<button class="${TR.f===k?'on':''}" data-f="${k}">${t}</button>`).join('');
  document.querySelectorAll('#trTabs .tab').forEach(b=>b.onclick=()=>{TR.tab=b.dataset.t;beep(500,.04);renderTr();$('#trList').scrollTop=0;});
  document.querySelectorAll('#trF button').forEach(b=>b.onclick=()=>{TR.f=b.dataset.f;beep(500,.04);renderTr();$('#trList').scrollTop=0;});
  let rows;
  if(TR.tab==='buy'){ rows=RESULTS[ST.season].teams.filter(c=>c!==ST.team).flatMap(c=>oppList(c)).filter(p=>TR.f==='all'||p.g===TR.f).sort((a,b)=>b.ovr-a.ovr||priceOf(a)-priceOf(b)).slice(0,80); }
  else rows=mine.filter(p=>TR.f==='all'||p.g===TR.f).sort((a,b)=>b.ovr-a.ovr);
  $('#trList').innerHTML=rows.map(p=>{ const c=clubOf(p.id), buy=TR.tab==='buy', pr=buy?priceOf(p):sellOf(p), no=buy&&pr>ST.budget;
    return `<button class="pl ${no?'no':''}" data-id="${p.id}"><span class="pos">${p.pos}</span>${kit(buy?c:ST.team,p.num)}<span class="nm">${flag(p)} ${esc(p.name)}${p.y?'<span class="y">Y</span>':''}<small>${buy?cname(c):c===ST.team?'Kendi oyuncun':'Transfer: '+cname(c)}</small></span><span class="pr"><b>${p.ovr}</b><small>${money(pr)}</small></span></button>`;}).join('')||'<div class="note">Bu mevkide oyuncu yok.</div>';
  document.querySelectorAll('#trList .pl').forEach(b=>b.onclick=()=>trSheet(getP(b.dataset.id),TR.tab==='buy'));
}
function trSheet(p,buy){
  const c=clubOf(p.id), pr=buy?priceOf(p):sellOf(p), why=trCheck(p,buy);
  const sh=document.createElement('div'); sh.className='sheet';
  sh.innerHTML=`<div class="in"><div class="pinfo">${kit(buy?c:ST.team,p.num)}<div><h3 class="disp">${esc(p.name)}</h3><div>${flag(p)} ${p.pos}${p.y?' · Yabancı':''} · ${buy?cname(c):cname(ST.team)}</div></div></div>
    <div class="stats"><div class="stat"><b>${p.ovr}</b><span>Güç</span></div><div class="stat" style="grid-column:span 2"><b>${money(pr)}</b><span>${buy?'Bonservis':'Satış geliri'}</span></div><div class="stat"><b>${money(ST.budget)}</b><span>Bütçe</span></div></div>
    ${why?`<div class="rule">${esc(why)}</div>`:`<div class="note">${buy?`Bütçen ${money(ST.budget-pr)} kalır.`:`Bütçen ${money(ST.budget+pr)} olur.`}</div>`}
    <div class="foot"><button class="btn ghost" data-x>Vazgeç</button><button class="btn" data-ok ${why?'disabled':''}>${buy?'Satın al':'Sat'}</button></div></div>`;
  sh.onclick=e=>{if(e.target===sh||e.target.closest('[data-x]'))sh.remove();};
  sh.querySelector('[data-ok]').onclick=()=>{ if(trCheck(p,buy))return;
    if(buy){ ST.budget=Math.round((ST.budget-pr)*10)/10; ST.roster.push(p.id);
      const used=new Set(myList().filter(x=>x.id!==p.id).map(x=>x.num)); let n=[...(NUM[p.pos]||[]),...Array.from({length:98},(_,i)=>i+2)].find(x=>!used.has(x)); ST.num[p.id]=n; p.num=n; }
    else { ST.budget=Math.round((ST.budget+pr)*10)/10; ST.roster=ST.roster.filter(x=>x!==p.id); delete ST.num[p.id]; delete ST.cond[p.id]; }
    ST.log.push({w:ST.week,id:p.id,buy}); saveStory(); sh.remove(); beep(buy?880:600,.12); buzz(20); toast(buy?'İmza':'Satıldı'); renderTr(); };
  $('#app').appendChild(sh);
}

/* ---------- kadro ekranı ---------- */
function lineup(o,go,back){
  show('lineup'); const c=o[o.you], list=(o.lists&&o.lists[o.you])||squad(o.season,c), cond=o.cond||{}, P=id=>list.find(p=>p.id===id);
  let sel=null;
  const row=(p,pos,k,extra='')=>{const cv=cond[p.id]??100;return `<button class="pl ${extra}" data-k="${k}"><span class="pos">${pos}</span>${kit(c,p.num)}<span class="nm">${flag(p)} ${esc(p.name)}${p.y?'<span class="y">Y</span>':''}<small>Kondisyon %${Math.round(cv)}<span class="cond"><i class="${cv<60?'low':cv<80?'mid':''}" style="width:${cv}%"></i></span></small></span><b>${p.ovr}</b></button>`;};
  const render=()=>{
    o.bench=benchFor(list,o.xi,cond); const fc=foreignCount(list,[...o.xi,...o.bench]);
    $('#luRule').innerHTML=`<b>Yabancı kuralı:</b> maç kadrosunda en fazla ${FOREIGN_MAX} yabancı. Şu an <b>${fc}/${FOREIGN_MAX}</b>. ${sel==null?'Değiştirmek istediğin oyuncuya dokun.':'Yerine girecek oyuncuyu seç.'}`;
    if(sel==null){
      $('#luXI').innerHTML=o.xi.map((id,k)=>row(P(id),SLOTS[k][0],k)).join('');
      $('#luBench').innerHTML=o.bench.map(id=>row(P(id),P(id).pos,'b')).join(''); $('#luBenchLbl').hidden=false;
    }else{
      const ok=SLOTS[sel][1];
      const cand=list.filter(p=>!o.xi.includes(p.id)).sort((a,b)=>(ok.includes(b.pos)-ok.includes(a.pos))||b.ovr-a.ovr);
      $('#luXI').innerHTML=row(P(o.xi[sel]),SLOTS[sel][0],sel,'sel')+cand.map(p=>row(p,p.pos+(ok.includes(p.pos)?'':'?'),'c:'+p.id)).join('');
      $('#luBench').innerHTML=''; $('#luBenchLbl').hidden=true;
    }
    document.querySelectorAll('#lineup .pl').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; beep(600,.04);
      if(k==='b')return; if(k.startsWith('c:')){o.xi[sel]=k.slice(2);sel=null;} else sel=sel===+k?null:+k; render(); $('#lineup .scroll').scrollTop=0; });
  };
  render();
  $('#luAuto').onclick=()=>{o.xi=bestXI(list,cond);sel=null;render();beep(500);};
  $('#luGo').onclick=()=>{beep(620);go();};
  $('#luBack').onclick=()=>{beep(400);back();};
}

const myDuels=()=>store.get('fdDuels',[]);
const addDuel=c=>{const l=myDuels().filter(x=>x!==c);l.unshift(c);store.set('fdDuels',l.slice(0,10));};
async function nameOf(id){ try{ if(!USER||!id)return 'Rakip'; const ps=await USER.profiles([id]); return (ps[id]&&ps[id].name)||'Rakip'; }catch(e){return 'Rakip';} }

async function renderDuels(){

async function createRoom(mode){
  const pool=SEASONS['2425'].play, h=pool[Math.floor(Math.random()*pool.length)]; let a; do{a=pool[Math.floor(Math.random()*pool.length)];}while(a===h);
  let code=newCode(); try{ for(let i=0;i<4;i++){const s=await DB.doc('duels/'+code).get(); if(!s.exists)break; code=newCode();} }catch(e){}
  const room={code,mode,season:'2425',h,a,seed:(Math.random()*1e9)|0,created:Date.now(),status:'p1',p1:ME};
  try{ await DB.doc('duels/'+code).set(room); }catch(e){ return onErr(e); }
  addDuel(code);
  const list=squad('2425',h),xi=bestXI(list);
  const o={season:'2425',h,a,you:'h',seed:room.seed,xi,bench:benchFor(list,xi)};
  lineup(o,()=>playMatch(o,async M=>{
    try{ await DB.doc('duels/'+code).update({status:'open',p1acts:M.acts,p1xi:o.xi,p1pre:[M.gh,M.ga]}); }catch(e){}
    resultScreen({M,title:'Düello · senin turun bitti',extra:`<div class="panel" style="text-align:center"><div class="lbl" style="color:var(--yellow)">Oda kodu</div><div class="code">${code}</div><div class="note">${mode==='friend'?'Bu kodu arkadaşına gönder.':'Rastgele bir rakip girince sonuç burada çıkar.'} Bu skor bilgisayara karşı oynadığın deneme. Resmi skor, rakip senin kararlarına karşı oynayınca belli olur.</div><div class="note" id="liveRes"></div></div>`,onNext:online,nextLabel:'Lobi'});
    watchRoom(code);
  }),online);
}
function watchRoom(code){
  stopWatch();
  try{ unsub=DB.doc('duels/'+code).onSnapshot(async s=>{ const d=s.exists&&s.data(), el=$('#liveRes'); if(!d||!el)return;
    if(d.status==='done'){ const nm=await nameOf(d.p2); el.innerHTML=`<b style="font-size:20px;color:#fff">Resmi skor: ${cname(d.h)} ${d.result[0]}-${d.result[1]} ${cname(d.a)}</b><br>Rakibin: ${esc(nm)}`; beep(880,.2); }
    else if(d.status==='playing')el.textContent='Rakip şu an oynuyor…'; },()=>{}); }catch(e){}
}
async function findRandom(){
  try{ const q=await DB.collection('duels').where('status','==','open').where('mode','==','random').limit(40).get();
    const c=q.docs.map(x=>x.data()).filter(d=>d.p1!==ME).sort((x,y)=>x.created-y.created)[0];
    if(c)return joinRoom(c.code); }catch(e){ return onErr(e); }
  createRoom('random');
}
async function joinRoom(code){
  if(!/^[A-Z]{4}$/.test(code))return note('Kod 4 harften oluşur.');
  let d; try{ const s=await DB.doc('duels/'+code).get(); d=s.exists?s.data():null; }catch(e){ return onErr(e); }
  if(!d)return note('Bu kodla bir oda yok.');
  if(d.p1===ME)return note('Bu oda senin, rakibini bekle.');
  if(d.status!=='open')return note(d.status==='p1'?'Oda sahibi henüz oynuyor, birazdan tekrar dene.':'Bu oda dolu.');
  try{ await DB.doc('duels/'+code).update({status:'playing',p2:ME}); }catch(e){ return onErr(e); }
  addDuel(code);
  const list=squad(d.season,d.a),xi=bestXI(list);
  const o={season:d.season,h:d.h,a:d.a,you:'a',seed:d.seed,xi,bench:benchFor(list,xi),sideXI:{h:d.p1xi},replay:{side:'h',acts:d.p1acts||[]}};
  const nm=await nameOf(d.p1);
  lineup(o,()=>playMatch(o,async M=>{
    try{ await DB.doc('duels/'+code).update({status:'done',result:[M.gh,M.ga],p2acts:M.acts}); }catch(e){}
    resultScreen({M,title:`Düello · rakip: ${nm}`,extra:'<div class="note" style="text-align:center">Bu resmi skor. Rakibin de lobide görecek.</div>',onNext:online,nextLabel:'Lobi'});
  }),online);
}
function note(t){const B=$('#onBody');if(!B)return;const n=document.createElement('div');n.className='panel note';n.textContent=t;B.prepend(n);setTimeout(()=>n.remove(),3500);beep(220,.12);}
function onErr(e){ show('online'); note(e&&(e.code==='permission_denied'||e.code==='not_granted')?'Bu sayfada yazma iznin yok. Sayfa sahibi linki seninle katılımcı olarak paylaşmalı.':'Bağlantı hatası, tekrar dene.'); }

/* ---------- ana ekran ---------- */
function home(){
  show('home'); stopWatch(); $('#hStreak').textContent=store.get('fdStreak',0);
  const s=store.get('fdStory',null);
  $('#mStorySub').textContent=s&&!s.done?`Devam et: ${cname(s.team)} · ${SEASONS[s.season].label} · Hafta ${s.week+1}`:'Bir sezon ve takım seç, şampiyon yap';
}
$('#mStory').onclick=()=>{beep(520); const s=store.get('fdStory',null); if(s){ST=s;hub();} else pickScreen('story');};
$('#mQuick').onclick=()=>{beep(520);pickScreen('quick');};
$('#mOnline').onclick=()=>{beep(520);online();};
document.querySelectorAll('[data-go="home"]').forEach(b=>b.onclick=()=>{beep(400);home();});
home();
</script>
