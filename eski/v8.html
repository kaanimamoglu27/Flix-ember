<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d81e27"><style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}</style></head><body><title>Flix Direktör</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800;1,900&family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: tek ekran oyun. Üstte bilgi, ortada akış, altta başparmak bölgesinde büyük butonlar (ana buton sağ altta). */
:root{
  --red:#d81e27; --red-deep:#b3141c; --navy:#15215c; --navy-deep:#0c1440; --yellow:#ffc72c;
  --paper:#fff4dc; --paper-edge:#f1dfb5; --ink:#15215c; --ok:#178a4a; --bad:#c8102e; --mute:#6b6f8c; --soft:rgba(255,255,255,.1);
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%;}
[hidden]{display:none!important;}
body{background:var(--red);color:#fff;font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
button,input{font:inherit;color:inherit;border:0;background:none;}
button{cursor:pointer;}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 14px;}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px;min-height:0;padding-bottom:4px;}
.disp{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;line-height:.95;letter-spacing:.01em;}
.lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 24px;border-radius:14px;background:var(--yellow);color:var(--navy);font-family:var(--display);font-weight:800;font-style:italic;font-size:24px;text-transform:uppercase;border:3px solid var(--navy);box-shadow:0 5px 0 var(--navy);transition:transform .08s,box-shadow .08s;}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--navy);}
.btn[disabled]{opacity:.45;pointer-events:none;}
.btn.ghost{background:transparent;color:#fff;border-color:#fff;box-shadow:none;font-size:19px;min-height:48px;padding:0 16px;}
.btn.wide{width:100%;}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.foot .btn:last-child{margin-left:auto;}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;}
.top h2{margin:0;font-size:32px;text-shadow:2px 2px 0 var(--navy);}
.back{font-size:15px;font-weight:700;padding:8px 2px;}
.card{background:var(--paper);color:var(--ink);border:3px solid var(--navy);border-radius:14px;box-shadow:0 4px 0 var(--navy);}
.panel{background:var(--navy);border-radius:14px;padding:12px;border:2px solid var(--navy-deep);}
svg.kit{display:block;}
.y{display:inline-block;font-size:9.5px;font-weight:800;background:var(--yellow);color:var(--navy);border-radius:3px;padding:0 3px;margin-left:4px;vertical-align:1px;}

/* Ana ekran: maç günü afişi. Arkada saha çizgisi, altta bilet ve başparmak bölgesinde ana buton */
#home{justify-content:space-between;background:var(--red);overflow:hidden;}
.hpitch{position:absolute;left:50%;top:-40px;width:150%;max-width:none;transform:translateX(-50%) rotate(-8deg);fill:none;stroke:var(--red-deep);stroke-width:2.2;pointer-events:none;}
.hpitch .f{fill:var(--red-deep);}
#home>*:not(.hpitch){position:relative;}
.home-top{display:flex;justify-content:space-between;align-items:flex-start;}
.home-top img{width:82px;height:auto;filter:drop-shadow(2px 3px 0 var(--navy));}
.badge{background:var(--navy);border-radius:10px;padding:6px 11px;text-align:right;transform:rotate(2deg);box-shadow:3px 3px 0 var(--navy-deep);}
.badge b{display:block;font-family:var(--display);font-style:italic;font-size:26px;color:var(--yellow);line-height:1;}
.badge span{font-size:10.5px;opacity:.85;}
.kick{display:inline-block;background:var(--navy);color:var(--yellow);font-family:var(--display);font-style:italic;font-weight:800;font-size:19px;text-transform:uppercase;padding:3px 10px 2px;transform:rotate(-2deg);margin-bottom:8px;box-shadow:3px 3px 0 var(--navy-deep);}
.hero h1{font-size:clamp(64px,21vw,104px);margin:0;color:#fff;text-shadow:4px 4px 0 var(--navy);}
.hero h1 small{display:block;font-size:.42em;color:var(--yellow);text-shadow:3px 3px 0 var(--navy);margin-bottom:4px;}
.hero p{margin:12px 0 0;max-width:31ch;font-size:15px;line-height:1.45;}
.hbot{display:flex;flex-direction:column;gap:10px;}
.hticket{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"tl tl tl" "tk tt go";gap:2px 10px;align-items:center;text-align:left;background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 12px 10px 12px;position:relative;box-shadow:0 4px 0 var(--navy);border:3px solid var(--navy);overflow:visible;}
.hticket::before,.hticket::after{content:"";position:absolute;top:24px;width:14px;height:14px;border-radius:50%;background:var(--red);border:3px solid var(--navy);}
.hticket::before{left:-10px;clip-path:inset(0 0 0 50%);} .hticket::after{right:-10px;clip-path:inset(0 50% 0 0);}
.hticket .tl{grid-area:tl;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red);border-bottom:2px dashed var(--paper-edge);padding-bottom:4px;margin-bottom:4px;}
.hticket .tk{grid-area:tk;display:flex;align-items:center;gap:2px;}
.hticket .tk svg{width:34px;height:34px;} .hticket .tk i{font-style:normal;font-weight:800;}
.hticket .tt{grid-area:tt;min-width:0;} .hticket b{display:block;font-family:var(--display);font-style:italic;font-weight:900;font-size:21px;text-transform:uppercase;line-height:1;}
.hticket small{display:block;font-size:12px;color:var(--mute);margin-top:3px;line-height:1.3;}
.hticket .go{grid-area:go;font-family:var(--display);font-weight:900;font-size:30px;}
.hrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mode{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:10px 12px;}
.mode b{font-family:var(--display);font-style:italic;font-weight:900;font-size:25px;text-transform:uppercase;line-height:1;}
.mode span{display:block;font-size:12px;color:var(--mute);margin-top:3px;line-height:1.25;}
.hgo{min-height:62px;font-size:28px;justify-content:space-between;}
.hgo i{font-style:normal;font-size:34px;}

/* Maç efektleri */
.ball{position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--navy);transform:translate(-50%,-50%);transition:left .55s cubic-bezier(.3,.7,.4,1),top .55s cubic-bezier(.3,.7,.4,1);z-index:3;left:50%;top:50%;box-shadow:2px 3px 0 rgba(12,20,64,.35);pointer-events:none;}
.mom{grid-column:1/-1;height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:2px;}
.mom i{display:block;height:100%;background:#9aa6e6;transition:width .6s;} .mom i.me{background:var(--yellow);}
.board .mom{direction:ltr;}
.ico.inj{width:12px;height:12px;border-radius:3px;background:#fff;color:var(--bad);font-weight:900;font-size:12px;line-height:12px;text-align:center;font-style:normal;}
.fx{position:absolute;inset:0;z-index:28;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;}
.fx b{font-size:74px;color:#fff;text-shadow:4px 4px 0 var(--navy);animation:fxin .45s cubic-bezier(.2,1.6,.4,1) both;}
.fx em{font-style:normal;font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;background:var(--navy);color:var(--yellow);padding:2px 12px;border-radius:6px;animation:fxin .45s .15s cubic-bezier(.2,1.6,.4,1) both;}
.fx.gfx{background:radial-gradient(circle at 50% 45%,rgba(12,20,64,.0),rgba(12,20,64,.55));animation:fxout 1.7s forwards;}
.fx.gfx.mine b{color:var(--yellow);}
.gfx .net{width:220px;height:auto;animation:netshake .5s .35s;}
.gfx .gball{position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--navy);left:50%;top:78%;animation:gball .45s cubic-bezier(.5,0,.7,.4) forwards;}
.gfx i{position:absolute;top:-12px;width:9px;height:14px;border:1.5px solid var(--navy);animation:conf 1.5s ease-in forwards;}
.fx.cfx,.fx.ifx{background:rgba(12,20,64,.45);animation:fxout 1.3s forwards;}
.rcard{width:62px;height:88px;border-radius:7px;border:4px solid var(--navy);box-shadow:5px 5px 0 var(--navy);animation:cardup .5s cubic-bezier(.2,1.5,.4,1) both;}
.rcard.red{background:#e8202a;} .rcard.yel{background:var(--yellow);}
.cfx b,.ifx b{font-size:48px;}
.cross{width:74px;height:74px;border-radius:16px;background:#fff;border:4px solid var(--navy);position:relative;animation:pulse .6s ease-in-out 2;}
.cross::before,.cross::after{content:"";position:absolute;background:var(--bad);left:50%;top:50%;transform:translate(-50%,-50%);width:16px;height:48px;border-radius:3px;} .cross::after{width:48px;height:16px;}
#app.shake{animation:shake .45s;}
@keyframes fxin{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fxout{0%,75%{opacity:1}100%{opacity:0}}
@keyframes gball{from{transform:translate(-50%,0) scale(1.3)}to{transform:translate(-50%,-150px) scale(.55)}}
@keyframes netshake{0%,100%{transform:none}30%{transform:scale(1.06,.96) translateY(-4px)}60%{transform:scale(.98,1.03)}}
@keyframes conf{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@keyframes cardup{from{transform:translateY(120px) rotate(-25deg);opacity:0}to{transform:rotate(8deg);opacity:1}}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
/* Bağırma menüsü */
#coachFace{padding:0;display:block;}
.sh-l{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);background:var(--navy);color:var(--yellow);font-family:var(--display);font-style:italic;font-weight:800;font-size:11px;text-transform:uppercase;padding:0 6px;border-radius:4px;pointer-events:none;}
.shouts{position:absolute;left:-4px;bottom:66px;z-index:6;width:236px;background:var(--navy);border:3px solid var(--yellow);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 var(--navy-deep);animation:deal .2s ease-out;}
.shouts .sh-t{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--yellow);}
.shouts button{background:var(--paper);color:var(--ink);border-radius:10px;padding:6px 10px;text-align:left;border:2px solid var(--navy-deep);}
.shouts button b{display:block;font-family:var(--display);font-style:italic;font-weight:900;font-size:20px;text-transform:uppercase;line-height:1;}
.shouts button small{font-size:11px;color:var(--mute);}
.shouts button[disabled]{opacity:.45;}
.shouts button.snd{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.4);font-size:12px;font-weight:700;padding:4px 10px;}
.injl{display:flex;flex-direction:column;gap:6px;}
.injl .bp{grid-template-columns:34px 1fr auto;}

/* Hoca */
.cchip span{opacity:1;font-size:inherit;}
.cchip{display:flex;align-items:center;gap:8px;text-align:left;padding:5px 10px 5px 5px;color:#fff;}
.cchip .cf{width:46px;height:46px;flex:none;border-radius:50%;border:2px solid var(--yellow);overflow:hidden;display:block;}
.cchip .cf svg,.coachf svg,.rcoach svg{width:100%;height:100%;display:block;}
.cchip b{display:block;font-family:var(--display);font-style:italic;font-size:21px;color:var(--yellow);line-height:1;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cchip small{font-size:10.5px;opacity:.85;} .cchip em{font-style:normal;font-weight:800;}
.coachf{position:relative;flex:none;}
#coachFace{width:54px;height:54px;border-radius:50%;border:3px solid var(--navy);overflow:hidden;background:var(--yellow);box-shadow:0 3px 0 var(--navy);}
#coachFace.bump{animation:cbump .35s cubic-bezier(.2,1.6,.4,1);}
@keyframes cbump{from{transform:scale(1.25) rotate(-6deg)}to{transform:none}}
.cbub{position:absolute;bottom:62px;left:-2px;background:#fff;color:var(--navy);font-family:var(--display);font-style:italic;font-weight:900;font-size:17px;text-transform:uppercase;padding:2px 9px;border:2px solid var(--navy);border-radius:10px;white-space:nowrap;z-index:5;animation:deal .25s cubic-bezier(.2,1.4,.4,1);}
.cbub::after{content:"";position:absolute;left:20px;bottom:-7px;width:10px;height:10px;background:#fff;border:2px solid var(--navy);border-top:0;border-left:0;transform:rotate(45deg);}
.rcoach{display:flex;align-items:center;justify-content:center;gap:10px;}
.rcoach svg{width:74px;height:74px;flex:none;border:3px solid var(--yellow);border-radius:50%;}
.cprev{display:flex;align-items:center;gap:14px;}
.cprev>button{width:128px;height:128px;flex:none;border-radius:50%;border:4px solid var(--navy);box-shadow:0 5px 0 var(--navy);overflow:hidden;padding:0;}
.cprev>button svg{width:100%;height:100%;display:block;}
.cprev>div{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1;}
.cprev input{box-sizing:border-box;background:#fff;color:var(--navy);border:3px solid var(--navy);border-radius:12px;padding:0 10px;min-height:48px;font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;text-transform:uppercase;width:100%;user-select:text;-webkit-user-select:text;}
.cprev small{font-size:12px;opacity:.85;} .cprev .back{align-self:flex-start;text-decoration:underline;font-size:14px;padding:2px 0;}
.crow{display:flex;flex-direction:column;gap:6px;} .crow .lbl{color:var(--yellow);}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chips button{font-size:13.5px;font-weight:700;border:2px solid #fff;border-radius:999px;padding:6px 12px;}
.chips button.on{background:var(--yellow);color:var(--navy);border-color:var(--navy);box-shadow:0 2px 0 var(--navy);}
.chips.sw button{width:38px;height:38px;padding:0;border:3px solid rgba(255,255,255,.6);}
.chips.sw button.on{border-color:var(--navy);outline:3px solid var(--yellow);box-shadow:none;}
.favs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;}
.favs button{flex:none;width:78px;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--paper);color:var(--ink);border:3px solid var(--navy);border-radius:12px;padding:6px 4px;font-size:11px;font-weight:700;line-height:1.1;text-align:center;}
.favs button svg{width:40px;height:40px;} .favs button.on{background:var(--yellow);transform:translateY(-3px);box-shadow:0 3px 0 var(--navy);}
.fav{color:var(--red);margin-right:4px;font-style:normal;}

/* Gerçek maçlar */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px;}
.sec .lbl{color:var(--yellow);}
.ticket{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;}
.tk2{display:flex;align-items:center;gap:1px;min-width:62px;justify-content:center;}
.tk2 svg{width:32px;height:32px;} .tk2 i{font-style:normal;font-weight:800;font-size:12px;}
.ticket b{display:block;font-family:var(--display);font-style:italic;font-weight:900;font-size:19px;text-transform:uppercase;line-height:1;}
.ticket small{display:block;font-size:11.5px;color:var(--mute);margin-top:3px;line-height:1.3;}
.ticket .tr{text-align:center;font-size:10px;font-weight:700;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;border-left:2px dashed var(--paper-edge);padding-left:10px;min-width:44px;}
.ticket .tr em{display:block;font-style:normal;font-family:var(--display);font-weight:900;font-size:26px;color:var(--ink);letter-spacing:0;}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.side{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;text-align:center;}
.side svg{width:58px;height:58px;} .side b{font-family:var(--display);font-style:italic;font-weight:900;font-size:20px;text-transform:uppercase;line-height:1;}
.side small{font-size:10.5px;font-weight:800;color:var(--red);letter-spacing:.08em;text-transform:uppercase;}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.vs .col{min-width:0;display:flex;} .pcard.flat{width:auto;flex:1;min-height:0;animation:none;}
.vs .col:last-child .pcard{background:var(--yellow);}
.same{align-self:center;background:var(--yellow);color:var(--navy);font-family:var(--display);font-style:italic;font-weight:900;font-size:19px;text-transform:uppercase;padding:3px 12px;border-radius:6px;transform:rotate(-2deg);}
.crowd{font-size:13px;line-height:1.4;background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px;}
.crowd b{color:var(--yellow);} .crowd small{opacity:.7;}
.evlist{display:flex;flex-direction:column;gap:4px;font-size:12.5px;}
.evlist .ev{display:flex;align-items:center;gap:6px;} .evlist .ev b{min-width:26px;color:var(--yellow);}
/* Teklif kartları ve eksikler */
.hand.offers{min-height:0;margin:0 -4px;}
.hand.offers .pcard{width:150px;}
.pcard.no{opacity:.55;}
.ofp{display:grid;grid-template-columns:34px 1fr;gap:6px;align-items:center;} .ofp svg{width:34px;height:34px;}
.ofp b{display:block;font-weight:700;font-size:13.5px;line-height:1.1;} .ofp small{font-size:11px;color:var(--mute);}
.price{font-family:var(--display);font-style:italic;font-weight:900;font-size:24px;margin-top:auto;}
.last.miss{display:flex;flex-wrap:wrap;gap:4px 12px;}
.last.miss span{display:inline-flex;align-items:center;gap:5px;font-weight:600;} .last.miss small{color:var(--mute);font-weight:400;}
.last.miss i{display:inline-block;width:12px;height:12px;flex:none;}
i.inj{background:var(--bad);border-radius:3px;position:relative;}
i.inj::before,i.inj::after{content:"";position:absolute;background:#fff;left:5px;top:2px;width:2px;height:8px;} i.inj::after{transform:rotate(90deg);}
i.ban{background:#ff3b3b;border-radius:2px;width:9px!important;border:1px solid var(--navy);}

/* Sezon / takım seçimi */
.tabs{display:flex;gap:8px;}
.tab{flex:1;min-height:44px;border-radius:12px;border:2px solid #fff;font-family:var(--display);font-style:italic;font-weight:800;font-size:20px;}
.tab.on{background:#fff;color:var(--red);}
.team{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px 12px;}
.team svg{width:52px;height:52px;}
.team b{font-family:var(--display);font-style:italic;font-weight:900;font-size:25px;text-transform:uppercase;line-height:1;}
.team small{display:block;font-size:12px;color:var(--mute);margin-top:3px;line-height:1.3;}
.team .r{text-align:center;font-size:10px;font-weight:700;color:var(--mute);letter-spacing:.06em;}
.team .r em{display:block;font-style:normal;font-family:var(--display);font-weight:900;font-size:26px;color:var(--ink);letter-spacing:0;}

/* Hub */
.hubhead{display:flex;align-items:center;gap:12px;}
.hubhead svg{width:54px;height:54px;flex:none;}
.hubhead h2{margin:0;font-size:30px;text-shadow:2px 2px 0 var(--navy);}
.hubhead div span{font-size:13px;opacity:.9;}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.kpi{background:var(--navy);border-radius:12px;padding:8px;text-align:center;}
.kpi b{display:block;font-family:var(--display);font-style:italic;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--yellow);}
.kpi span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;}
.kpi b.plus{color:#7be3a6;} .kpi b.minus{color:#ffb0b0;}
.next{padding:12px;display:flex;flex-direction:column;gap:8px;}
.vsrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;}
.vsrow svg{width:46px;height:46px;margin:0 auto;}
.vsrow b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;text-transform:uppercase;margin-top:2px;}

/* Maç: üstte skorbord ve olay şeridi, ortada saha, altta kart eli; ana buton sağ altta */
#match{gap:7px;padding-top:8px;}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--navy);border:2px solid var(--navy-deep);border-radius:14px;padding:6px 10px;gap:8px;}
.bteam{display:flex;align-items:center;gap:6px;min-width:0;text-align:left;}

.bteam svg{width:30px;height:30px;flex:none;}
.bteam span{font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.bteam small{display:block;font-family:var(--body);font-style:normal;font-weight:600;font-size:10px;letter-spacing:.04em;opacity:.75;text-transform:none;}
.bteam.me span{color:var(--yellow);}
.bscore{text-align:center;}
.bscore b{font-family:var(--display);font-style:italic;font-weight:900;font-size:36px;line-height:1;font-variant-numeric:tabular-nums;}
.bscore em{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--navy);background:var(--yellow);border-radius:4px;padding:0 6px;margin-top:2px;font-variant-numeric:tabular-nums;}
.feed{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-height:26px;flex:none;}
.feed::-webkit-scrollbar{display:none;}
.ev{flex:none;display:flex;align-items:center;gap:5px;background:rgba(12,20,64,.32);border-radius:8px;padding:4px 8px;font-size:12px;white-space:nowrap;animation:in .25s ease-out;}
.ev b{font-variant-numeric:tabular-nums;}
.ev.goal{background:var(--yellow);color:var(--navy);font-weight:700;}
.ev.me{background:var(--navy);}
@keyframes in{from{transform:translateX(-10px);opacity:0}to{transform:none;opacity:1}}
.ico{display:inline-block;flex:none;}
.ico.ball{width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--navy);}
.ico.sub{font-weight:800;font-size:12px;color:var(--yellow);}
.ev.goal .ico.sub{color:var(--navy);}
.pitch{position:relative;flex:1;min-height:190px;border:3px solid var(--navy);border-radius:10px;overflow:hidden;background:repeating-linear-gradient(180deg,#c4161f 0 12.5%,#b8121b 12.5% 25%);}
.pitch .lines{position:absolute;inset:0;width:100%;height:100%;}
.sit{position:absolute;left:8px;right:8px;top:8px;display:flex;flex-wrap:wrap;gap:5px;z-index:3;pointer-events:none;}
.chip{background:var(--navy);color:#fff;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;}
.chip.warn{background:var(--yellow);color:var(--navy);}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:70px;z-index:2;}
.tok svg{width:34px;height:34px;filter:drop-shadow(0 2px 0 rgba(12,20,64,.45));transition:transform .15s;}
.tok .nm{margin-top:1px;background:var(--navy);color:#fff;font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:4px;white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis;}
.tok .sta{width:40px;height:4px;background:rgba(12,20,64,.5);border-radius:2px;margin-top:2px;overflow:hidden;}
.tok .sta i{display:block;height:100%;background:#fff;}
.tok .sta i.low{background:var(--yellow);}
.tok .ov{position:absolute;top:-2px;left:8px;font-size:10px;font-weight:800;background:#fff;color:var(--navy);border-radius:4px;padding:0 3px;font-variant-numeric:tabular-nums;}
.tok .fl{position:absolute;top:-3px;right:9px;font-size:13px;line-height:1;}
.tok.out{opacity:.35;}
.tok .ycd{position:absolute;top:12px;right:13px;width:7px;height:10px;border-radius:2px;background:var(--yellow);border:1px solid var(--navy);}
.ico.yc,.ico.rc{width:8px;height:11px;border-radius:2px;background:var(--yellow);}
.ico.rc{background:#ff3b3b;}
.tok.in svg{transform:scale(1.12);}
.tok.sel svg{transform:scale(1.18);}
.tok.sel .nm,.tok.in .nm{background:var(--yellow);color:var(--navy);}
.hint{text-align:center;font-size:11.5px;opacity:.9;margin-top:-2px;min-height:14px;}
.hand{display:flex;gap:10px;overflow-x:auto;padding:10px 4px 6px;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:160px;flex:none;}
.hand::-webkit-scrollbar{display:none;}
.pcard{flex:none;width:136px;min-height:146px;scroll-snap-align:start;background:var(--paper);color:var(--ink);border:3px solid var(--navy);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 4px 0 var(--navy);transition:transform .15s,box-shadow .15s;position:relative;animation:deal .3s cubic-bezier(.2,1.4,.4,1) backwards;}
.pcard:nth-child(2){animation-delay:.06s}.pcard:nth-child(3){animation-delay:.12s}.pcard:nth-child(4){animation-delay:.18s}
@keyframes deal{from{transform:translateY(50px) rotate(-6deg);opacity:0}}
.pcard:nth-child(odd){transform:rotate(-1.2deg);}
.pcard:nth-child(even){transform:rotate(1.2deg);}
.pcard.on{transform:translateY(-10px) rotate(0);box-shadow:0 10px 0 var(--navy);background:#fff;outline:3px solid var(--yellow);outline-offset:-7px;}
.pcard .kind{font-family:var(--display);font-style:italic;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px dashed var(--paper-edge);padding-bottom:4px;display:flex;justify-content:space-between;gap:4px;}
.pcard .kind i{font-style:normal;color:var(--mute);font-size:13px;white-space:nowrap;}
.prow{display:grid;grid-template-columns:14px 28px 1fr;gap:4px;align-items:center;}
.prow svg{width:28px;height:28px;}
.prow .arr{font-weight:900;font-size:14px;text-align:center;}
.prow .arr.dn{color:var(--bad);} .prow .arr.up{color:var(--ok);}
.prow .pn{font-size:12px;font-weight:700;line-height:1.15;min-width:0;overflow:hidden;}
.prow .pn small{display:block;font-weight:500;color:var(--mute);font-size:10.5px;white-space:nowrap;}
.pcard .big{font-family:var(--display);font-style:italic;font-weight:900;font-size:30px;text-transform:uppercase;line-height:.9;margin-top:4px;}
.pcard .txt{font-size:11.5px;line-height:1.35;color:#3a3f63;}
.pcard .fx{margin-top:auto;font-size:10.5px;font-weight:800;line-height:1.3;}
.fx .up{color:var(--ok);} .fx .dn{color:var(--bad);}
.pcard.make{background:transparent;border-style:dashed;border-color:var(--paper);color:#fff;box-shadow:none;justify-content:center;align-items:center;text-align:center;}
.pcard.make .big{font-size:24px;}
.pcard.make .txt{color:#fff;}
.pcard.live{width:100%;animation:none;transform:none;}
.pcard.live .big{font-size:40px;font-variant-numeric:tabular-nums;}
.act{display:flex;align-items:center;gap:12px;}
.tacbar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--navy);border-radius:12px;padding:4px;flex:none;}
.tacbar button{min-height:34px;border-radius:9px;font-family:var(--display);font-style:italic;font-weight:800;font-size:15px;text-transform:uppercase;}
.tacbar button.on{background:var(--yellow);color:var(--navy);}
.timer{flex:1;min-width:0;}
.timer .bar{height:8px;background:rgba(12,20,64,.4);border-radius:4px;overflow:hidden;}
.timer .bar i{display:block;height:100%;background:var(--yellow);transform-origin:left;}
.timer span{font-size:12px;display:block;margin-top:4px;opacity:.9;}
/* Karar sonucu */
.prob{display:grid;grid-template-columns:minmax(0,1fr) 92px 42px;gap:8px;align-items:center;font-size:12.5px;}
.prob span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prob.mine span:first-child{color:var(--yellow);font-weight:700;}
.prob .bar{height:12px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;}
.prob .bar i{display:block;height:100%;background:#9aa6e6;}
.prob.mine .bar i{background:var(--yellow);}
.prob b{text-align:right;font-variant-numeric:tabular-nums;}
.total{display:flex;align-items:flex-end;justify-content:space-between;border-top:2px dashed rgba(255,255,255,.25);padding-top:8px;}
.total b{font-family:var(--display);font-style:italic;font-size:54px;line-height:.85;color:var(--yellow);font-variant-numeric:tabular-nums;}
.pinfo{display:flex;gap:12px;align-items:center;}
.pinfo svg{width:56px;height:56px;}

.stat{background:rgba(255,255,255,.08);border-radius:10px;padding:6px;text-align:center;}
.stat b{display:block;font-family:var(--display);font-style:italic;font-size:22px;font-variant-numeric:tabular-nums;}
.stat span{font-size:10px;opacity:.8;letter-spacing:.06em;text-transform:uppercase;}
.bp{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--paper);color:var(--ink);border-radius:10px;padding:6px 10px;text-align:left;}
.bp svg{width:34px;height:34px;}
.bp b{font-family:var(--display);font-style:italic;font-size:22px;}
.bp small{display:block;color:var(--mute);font-size:11px;}
.bp[disabled]{opacity:.4;}
.bp.ro{background:rgba(255,255,255,.08);color:#fff;}
.bp.ro small{color:rgba(255,255,255,.7);}

/* Transfer */
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none;}

.fchips button.on{background:#fff;color:var(--red);}
.pl.no{opacity:.5;}
.pl .pr{text-align:right;line-height:1;}
.pl .pr small{display:block;font-size:11px;font-weight:700;color:var(--yellow);margin-top:3px;white-space:nowrap;}
.trf{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:left;padding:10px 12px;}
.trf b{font-family:var(--display);font-style:italic;font-weight:900;font-size:24px;text-transform:uppercase;line-height:1;}
.trf span{display:block;font-size:12px;color:var(--mute);margin-top:2px;}
.trf i{font-style:normal;font-family:var(--display);font-weight:900;font-size:28px;}
.last{font-size:13px;line-height:1.4;border-top:2px dashed var(--paper-edge);padding-top:6px;}

#result{background:var(--navy);}
.big{font-family:var(--display);font-style:italic;font-weight:900;font-size:76px;line-height:.9;text-align:center;font-variant-numeric:tabular-nums;}

.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cmp div{background:var(--soft);border-radius:12px;padding:10px;text-align:center;}

.cmp span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.8;}
.gl{font-size:13px;line-height:1.6;opacity:.9;text-align:center;}

.duel{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;font-size:13px;}

.note{font-size:12.5px;opacity:.9;line-height:1.45;}

/* ---------- yardımcılar ---------- */
const $=s=>document.querySelector(s);
const rngF=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const hash=str=>{let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let actx=null;
function beep(f=660,d=.08,type='square',v=.045){if(window.SNDOFF)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.stop(actx.currentTime+d+.02);}catch(e){}}
const whistle=()=>{beep(2300,.16,'sine',.06);setTimeout(()=>beep(2500,.3,'sine',.06),190);};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
function show(id){for(const s of document.querySelectorAll('.screen'))s.hidden=s.id!==id;document.querySelectorAll('.toast').forEach(t=>t.remove());}
window.SNDOFF=store.get('fdMute',false);
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('#app').appendChild(d);setTimeout(()=>d.remove(),1150);}

let kitN=0;
function kit(c,num){
  const [, ,type,c1,c2,n]=CLUB[c], id='k'+(kitN++);
  const shirt='M12 4 L16.5 3 Q20 6.5 23.5 3 L28 4 L37.5 11.5 L33 17.5 L30 15.5 L30 37 L10 37 L10 15.5 L7 17.5 L2.5 11.5 Z';
  let p=`<rect width="40" height="40" fill="${c1}"/>`;
  if(type==='halves')p+=`<rect x="20" width="20" height="40" fill="${c2}"/>`;
  else if(type==='stripes')p+=[6,14,22,30].map(x=>`<rect x="${x}" width="4" height="40" fill="${c2}"/>`).join('');
  else if(type==='sleeves')p+=`<rect width="10.5" height="40" fill="${c2}"/><rect x="29.5" width="10.5" height="40" fill="${c2}"/>`;
  else if(type==='sash')p+=`<polygon points="8,0 17,0 34,40 25,40" fill="${c2}"/>`;
  else if(type==='checks'){ for(let y=0;y<40;y+=6)for(let x=(y/6)%2?6:0;x<40;x+=12)p+=`<rect x="${x}" y="${y}" width="6" height="6" fill="${c2}"/>`; }
  else p+=`<rect width="40" height="8" fill="${c2}"/><rect x="0" y="11" width="7" height="4" fill="${c2}"/><rect x="33" y="11" width="7" height="4" fill="${c2}"/>`;
  const t=num==null?'':`<text x="20" y="27.5" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="13" fill="${n}" stroke="${type==='stripes'||type==='checks'?c1:'none'}" stroke-width="2.4" paint-order="stroke">${num}</text>`;
  return `<svg class="kit" viewBox="0 0 40 40" aria-hidden="true"><defs><clipPath id="${id}"><path d="${shirt}"/></clipPath></defs><g clip-path="url(#${id})">${p}</g><path d="${shirt}" fill="none" stroke="#15215c" stroke-width="1.6" stroke-linejoin="round"/>${t}</svg>`;
}

const FX={};

  if(FX[season])return FX[season];
  const t=RESULTS[season].teams.slice(); if(t.length%2)t.push(null); const n=t.length,rounds=[],arr=t.slice(1);
  for(let r=0;r<n-1;r++){ const cur=[t[0],...arr],ms=[];
    for(let i=0;i<n/2;i++){ let h=cur[i],a=cur[n-1-i]; if((r+i)%2)[h,a]=[a,h]; if(h&&a)ms.push([h,a]); }

}

function table(){
  const t={},fx=fixtures(ST.season),R=RESULTS[ST.season].res;
  RESULTS[ST.season].teams.forEach(c=>t[c]={c,p:0,gf:0,ga:0,pts:SEASONS[ST.season].ded[c]||0});
  const add=(c,f,g)=>{const T=t[c];T.p++;T.gf+=f;T.ga+=g;T.pts+=f>g?3:f===g?1:0;};
  for(let w=0;w<ST.week&&w<fx.length;w++)for(const [h,a] of fx[w]){ const real=R[h+'-'+a];
    if(h===ST.team||a===ST.team){ const my=ST.played[h+'-'+a]||real;

    else { add(h,real[0],real[1]); add(a,real[1],real[0]); } }
  return Object.values(t).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);

const trKey=()=>ST.week<3?'yaz':'devre';
function trCheck(p,buy,price){
  if(!trWindow())return 'Transfer dönemi kapalı.';
  const mine=myList();
  if(buy){ const seller=oppList(clubOf(p.id));
    if(ST.budget<price)return 'Bütçen yetmiyor.';
    if(mine.length>=SQUAD_MAX)return `Kadro dolu (en fazla ${SQUAD_MAX}).`;
    if(seller.length<=SQUAD_MIN)return `${cname(clubOf(p.id))} daha fazla oyuncu satmıyor.`;
  } else {
    if(mine.length<=SQUAD_MIN)return `Kadroda en az ${SQUAD_MIN} oyuncu kalmalı.`;
    if(p.g==='G'&&mine.filter(x=>x.g==='G').length<=2)return 'En az 2 kalecin kalmalı.';

  return '';
}
function makeOffers(){
  const r=rngF(hash(ST.season+ST.team+trKey()+ST.n)), mine=myList(), xi=new Set(bestXI(mine,ST.cond));
  const weak={}; for(const p of mine)if(xi.has(p.id))weak[p.g]=Math.min(weak[p.g]??99,p.ovr);
  const pool=RESULTS[ST.season].teams.filter(c=>c!==ST.team).flatMap(c=>oppList(c)).filter(p=>p.g!=='G'&&p.ovr>=(weak[p.g]??70)+1&&priceOf(p)<=ST.budget*1.3&&avail(p.id))
    .sort((a,b)=>b.ovr-a.ovr).slice(0,14);
  const out=[]; while(out.length<2&&pool.length){ const p=pool.splice(Math.floor(r()*pool.length),1)[0]; if(out.some(o=>getP(o.id).g===p.g)&&pool.some(q=>!out.some(o=>getP(o.id).g===q.g)))continue; out.push({k:'buy',id:p.id,price:Math.round(priceOf(p)*(0.9+r()*.25)*10)/10}); }
  const bench=mine.filter(p=>!xi.has(p.id)&&p.g!=='G').sort((a,b)=>b.ovr-a.ovr).slice(0,4);
  if(bench.length){ const p=bench[Math.floor(r()*bench.length)], others=RESULTS[ST.season].teams.filter(c=>c!==ST.team);
    out.push({k:'sell',id:p.id,price:Math.round(priceOf(p)*(1+r()*.3)*10)/10,buyer:others[Math.floor(r()*others.length)]}); }
  return out;
}

  $('#pickTitle').textContent=P.mode==='story'?'Takım seç':P.step===0?'Takımın':'Rakibin';
  $('#seasonTabs').innerHTML=Object.keys(SEASONS).map(k=>`<button class="tab ${k===P.season?'on':''}" data-s="${k}">${SEASONS[k].label}</button>`).join('');
  document.querySelectorAll('#seasonTabs .tab').forEach(b=>b.onclick=()=>{PICK.season=b.dataset.s;PICK.step=0;PICK.h=null;renderPick();beep(500,.04);});
  const all=RESULTS[P.season].teams.filter(c=>c!==P.h);
  const fv=favClub(); let order=P.mode==='story'?S.play.slice():[...S.play.filter(c=>c!==P.h),...all.filter(c=>!S.play.includes(c))];
  if(fv&&P.step===0&&RESULTS[P.season].teams.includes(fv)){ order=[fv,...order.filter(c=>c!==fv)]; }
  $('#teamList').innerHTML=(P.mode==='story'?'<div class="note">Sezonun bütün gerçek sonuçları oyunda. Senin maçlarını sen oynarsın, diğer maçlar gerçekte nasıl bittiyse öyle biter.</div>':'')+
   order.map(c=>{const star=squad(P.season,c).slice().sort((a,b)=>b.ovr-a.ovr).slice(0,3).map(p=>p.name).join(', ');
    const r=S.real[c];
    return `<button class="card team" data-c="${c}">${kit(c)}<div><b>${c===fv?'<span class="fav">★</span>':''}${cname(c)}</b><small>${S.play.includes(c)?esc(star):'Kurgusal kadro'}</small></div>${r?`<div class="r">GERÇEKTE<em>${r.split(' · ')[0]}</em>${r.split(' · ')[1]}</div>`:''}</button>`;}).join('');
  document.querySelectorAll('#teamList .team').forEach(b=>b.onclick=()=>{ beep(560); const c=b.dataset.c;
    if(P.mode==='story')return newStory(P.season,c);
    if(P.step===0){PICK.h=c;PICK.step=1;renderPick();$('#teamList').scrollTop=0;return;}
    quickMatch(P.season,P.h,c); });
}
function quickMatch(season,h,a){
  const list=squad(season,h),xi=bestXI(list);
  const o={season,h,a,you:'h',seed:(Math.random()*1e9)|0,xi,bench:benchFor(list,xi)};
  const real=RESULTS[season].res[h+'-'+a];
  playMatch(o,M=>resultScreen({M,real,title:`Hızlı maç · ${SEASONS[season].label}`,onNext:home,nextLabel:'Menü',onAgain:()=>quickMatch(season,h,a)}));
}

let DB=null,USER=null,ME=null;
const capP=(async()=>{ try{ if(!window.claude||!window.claude.use)return; DB=await window.claude.use('db'); USER=await window.claude.use('user'); if(USER)ME=await USER.id(); }catch(e){} })();
const CODECH='ABCDEFGHJKLMNPRSTUVWXYZ';
const newCode=()=>Array.from({length:4},()=>CODECH[Math.floor(Math.random()*CODECH.length)]).join('');
const myDuels=()=>store.get('fdDuels',[]);
const addDuel=c=>{const l=myDuels().filter(x=>x!==c);l.unshift(c);store.set('fdDuels',l.slice(0,10));};
async function nameOf(id){ try{ if(!USER||!id)return 'Rakip'; const ps=await USER.profiles([id]); return (ps[id]&&ps[id].name)||'Rakip'; }catch(e){return 'Rakip';} }
let unsub=null;
const stopWatch=()=>{if(unsub){try{unsub();}catch(e){}unsub=null;}};
async function online(){
  show('online'); stopWatch(); const B=$('#onBody');
  B.innerHTML='<div class="note">Bağlanıyor…</div>';
  await Promise.race([capP,new Promise(r=>setTimeout(r,10500))]);
  if(!DB||!ME){ B.innerHTML=`<div class="panel note">Online düello, oyun Claude uygulamasındaki artifact linkinden açılınca çalışır. Arkadaşının da oynayabilmesi için linki ona <b>katılımcı</b> olarak paylaşman gerekir. Şu an bağlantı kurulamadı.</div>`; return; }
  B.innerHTML=`<div class="panel note"><b style="color:var(--yellow)">Nasıl oynanır?</b> İkiniz aynı derbiyi yönetirsiniz: oda kuran ev sahibinin, katılan deplasmanın hocası olur. Önce oda sahibi oynar. Sonra rakip, onun kararlarına karşı oynar ve resmi skor çıkar.</div>
   <button class="btn wide" id="onRand">Rastgele rakip bul</button>
   <button class="btn ghost wide" id="onNew">Arkadaş için oda kur</button>
   <div class="inrow"><input id="onCode" maxlength="4" placeholder="KOD" autocomplete="off" aria-label="Oda kodu"><button class="btn" id="onJoin">Katıl</button></div>
   <div class="lbl" style="opacity:.8">Düellolarım</div><div id="onList" class="xi"></div>`;
  $('#onRand').onclick=()=>{beep(520);findRandom();}; $('#onNew').onclick=()=>{beep(520);createRoom('friend');};
  $('#onJoin').onclick=()=>{beep(520);joinRoom(($('#onCode').value||'').toUpperCase().trim());};
  renderDuels();
}
async function renderDuels(){
  const box=$('#onList'); if(!box)return; const codes=myDuels(); if(!codes.length){box.innerHTML='<div class="note">Henüz düello yok.</div>';return;}
  const rows=await Promise.all(codes.map(async c=>{try{const s=await DB.doc('duels/'+c).get();return s.exists?s.data():null;}catch(e){return null;}}));
  box.innerHTML=rows.filter(Boolean).map(d=>{ const mine=d.p1===ME?'h':'a';
    const st=d.status==='done'?`${d.result[0]}-${d.result[1]}`:d.status==='open'?'Rakip bekleniyor':d.status==='playing'?'Rakip oynuyor':'Yarım kaldı';
    return `<div class="card duel"><div>${cname(d.h)} – ${cname(d.a)}<br><small style="color:var(--mute)">Kod ${d.code} · Sen: ${cname(d[mine])}</small></div><b>${st}</b></div>`;}).join('')||'<div class="note">Henüz düello yok.</div>';
}
async function createRoom(mode){
  const pool=SEASONS['2425'].play, h=pool[Math.floor(Math.random()*pool.length)]; let a; do{a=pool[Math.floor(Math.random()*pool.length)];}while(a===h);
  let code=newCode(); try{ for(let i=0;i<4;i++){const s=await DB.doc('duels/'+code).get(); if(!s.exists)break; code=newCode();} }catch(e){}
  const room={code,mode,season:'2425',h,a,seed:(Math.random()*1e9)|0,created:Date.now(),status:'p1',p1:ME};
  try{ await DB.doc('duels/'+code).set(room); }catch(e){ return onErr(e); }
  addDuel(code);
  const list=squad('2425',h),xi=bestXI(list);
  const o={season:'2425',h,a,you:'h',seed:room.seed,xi,bench:benchFor(list,xi)};
  playMatch(o,async M=>{
    try{ await DB.doc('duels/'+code).update({status:'open',p1acts:M.acts,p1xi:o.xi,p1pre:[M.gh,M.ga]}); }catch(e){}
    resultScreen({M,title:'Düello · senin turun bitti',extra:`<div class="panel" style="text-align:center"><div class="lbl" style="color:var(--yellow)">Oda kodu</div><div class="code">${code}</div><div class="note">${mode==='friend'?'Bu kodu arkadaşına gönder.':'Rastgele bir rakip girince sonuç burada çıkar.'} Bu skor bilgisayara karşı oynadığın deneme. Resmi skor, rakip senin kararlarına karşı oynayınca belli olur.</div><div class="note" id="liveRes"></div></div>`,onNext:online,nextLabel:'Lobi'});
    watchRoom(code);
  });
}
function watchRoom(code){
  stopWatch();
  try{ unsub=DB.doc('duels/'+code).onSnapshot(async s=>{ const d=s.exists&&s.data(), el=$('#liveRes'); if(!d||!el)return;
    if(d.status==='done'){ const nm=await nameOf(d.p2); el.innerHTML=`<b style="font-size:20px;color:#fff">Resmi skor: ${cname(d.h)} ${d.result[0]}-${d.result[1]} ${cname(d.a)}</b><br>Rakibin: ${esc(nm)}`; beep(880,.2); }
    else if(d.status==='playing')el.textContent='Rakip şu an oynuyor…'; },()=>{}); }catch(e){}
}
async function findRandom(){
  try{ const q=await DB.collection('duels').where('status','==','open').where('mode','==','random').limit(40).get();
    const c=q.docs.map(x=>x.data()).filter(d=>d.p1!==ME).sort((x,y)=>x.created-y.created)[0];
    if(c)return joinRoom(c.code); }catch(e){ return onErr(e); }
  createRoom('random');
}
async function joinRoom(code){
  if(!/^[A-Z]{4}$/.test(code))return note('Kod 4 harften oluşur.');
  let d; try{ const s=await DB.doc('duels/'+code).get(); d=s.exists?s.data():null; }catch(e){ return onErr(e); }
  if(!d)return note('Bu kodla bir oda yok.');
  if(d.p1===ME)return note('Bu oda senin, rakibini bekle.');
  if(d.status!=='open')return note(d.status==='p1'?'Oda sahibi henüz oynuyor, birazdan tekrar dene.':'Bu oda dolu.');
  try{ await DB.doc('duels/'+code).update({status:'playing',p2:ME}); }catch(e){ return onErr(e); }
  addDuel(code);
  const list=squad(d.season,d.a),xi=bestXI(list);
  const o={season:d.season,h:d.h,a:d.a,you:'a',seed:d.seed,xi,bench:benchFor(list,xi),sideXI:{h:d.p1xi},replay:{side:'h',acts:d.p1acts||[]}};
  const nm=await nameOf(d.p1);
  playMatch(o,async M=>{
    try{ await DB.doc('duels/'+code).update({status:'done',result:[M.gh,M.ga],p2acts:M.acts}); }catch(e){}
    resultScreen({M,title:`Düello · rakip: ${nm}`,extra:'<div class="note" style="text-align:center">Bu resmi skor. Rakibin de lobide görecek.</div>',onNext:online,nextLabel:'Lobi'});
  });
}
function note(t){const B=$('#onBody');if(!B)return;const n=document.createElement('div');n.className='panel note';n.textContent=t;B.prepend(n);setTimeout(()=>n.remove(),3500);beep(220,.12);}
function onErr(e){ show('online'); note(e&&(e.code==='permission_denied'||e.code==='not_granted')?'Bu sayfada yazma iznin yok. Sayfa sahibi linki seninle katılımcı olarak paylaşmalı.':'Bağlantı hatası, tekrar dene.'); }

/* ---------- gerçek maç modu: maç gerçekteki gibi akar, karar anında sen seçersin, sonra hocanın gerçek kararı açılır ---------- */
const RP={};
function realSide(sc,s){
  const key=sc.id+'-'+s, list=RP[key]||(RP[key]=finishSq(parseSq(key,sc.sq[s])));
  const P={},sta0={}; list.forEach(p=>{P[p.id]=p;sta0[p.id]=100;});
  const S={c:sc[s],xi:list.slice(0,11).map(p=>p.id),bench:list.slice(11).map(p=>p.id),P,sta0,entry:{},subs:5,tac:0,str:{att:Math.pow(sc.str[s].att,.6),def:Math.pow(sc.str[s].def,.6)},yc:{}};
  S.base=sideQ(S,0); return S;
}
const pid=(sc,s,i)=>sc.id+'-'+s+':'+i;
/* gerçek olaylar: 90 dakikayla sınırlı (uzatmalar notta anlatılır) */
function realActs(sc,side,from,to=91,kinds='sr'){
  return sc.ev.filter(e=>e[2]===side&&e[0]>=from&&e[0]<to&&kinds.includes(e[1]))
    .map(e=>e[1]==='s'?{k:'sub',o:pid(sc,side,e[3]),i:pid(sc,side,e[4]),m:e[0]}:{k:'red',o:pid(sc,side,e[3]),m:e[0]});
}
function newRealM(sc,you,seed){
  return {o:{you,seed,h:sc.h,a:sc.a,real:sc.id},sides:{h:realSide(sc,'h'),a:realSide(sc,'a')},m:0,gh:0,ga:0,r:rngF(seed),acts:[],done:false,scorers:[],cards:[],dec:[]};
}
function realStep(M,sc){
  M.m++; const ev=[];
  for(const e of sc.ev){ if(e[0]!==M.m)continue; const s=e[2],S=M.sides[s],p=S.P[pid(sc,s,e[3])];
    if(e[1]==='g'){ s==='h'?M.gh++:M.ga++; ev.push({t:'goal',s,p}); }
    else if(e[1]==='s'){ const a={k:'sub',o:p.id,i:pid(sc,s,e[4]),m:M.m}; if(applyAct(M,s,a))ev.push({t:'act',s,a}); }
    else if(e[1]==='y'){ S.yc[p.id]=1; ev.push({t:'card',s,p,c:'y'}); }
    else if(e[1]==='r'){ applyAct(M,s,{k:'red',o:p.id}); ev.push({t:'card',s,p,c:'r'}); } }
  if(M.m===45)ev.push({t:'ht'});
  if(M.m>=90)M.done=true;
  M.lh=lam(M,'h',M.m); M.la=lam(M,'a',M.m);
  return ev;
}

  const p=S.P[id]; ev.push({t:'inj',s,p}); (M.inj=M.inj||[]).push({s,id,m:M.m});

    $('#cFace').onclick=()=>{ mood=(mood+1)%MOODS.length; beep(500+mood*60,.05); $('#cFace').innerHTML=coachSVG(c,MOODS[mood]); };
    $('#cName').oninput=e=>{ c.name=e.target.value; };
    $('#cRand').onclick=()=>{ const r=n=>Math.floor(Math.random()*n); c={...c,skin:r(SKIN.length),hair:r(HAIRS.length),hairc:r(HAIRC.length),beard:r(BEARDS.length),glasses:r(GLASSES.length),outfit:r(OUTFITS.length)}; beep(700,.06); render(); };
  };
  $('#coachSave').onclick=()=>{ c.name=(c.name||'').trim()||'Hoca'; COACH=c; store.set('fdCoach',c); beep(880,.1); buzz(15); home(); };
  render();
}

/* ---------- ana ekran ---------- */
function home(){
  if(!store.get('fdCoach',null))return coachScreen(true);
  crowd.stop(); show('home'); stopWatch(); $('#hStreak').textContent=store.get('fdStreak',0); $('#hName').textContent=COACH.name; $('#hFace').innerHTML=coachSVG(COACH,'happy');
  const s=store.get('fdStory',null);
  $('#mStorySub').textContent=s&&!s.done?`Devam: ${cname(s.team)} · ${s.week+1}. hafta`:'Bir sezon seç, şampiyon yap';
  const fv=favClub(), wk=REAL.filter(x=>x.cat==='week'), sc=wk.find(x=>x.h===fv||x.a===fv)||wk[0], y=sc.h===fv?'h':sc.a===fv?'a':sc.you||'h', subs=sc.ev.filter(e=>e[1]==='s'&&e[2]===y), m0=subs.length?subs[0][0]:0, n0=subs.filter(e=>e[0]===m0).length;
  $('#hTicket').innerHTML=`<span class="tl">Bu hafta</span><span class="tk">${kit(sc.h)}<i>–</i>${kit(sc.a)}</span><span class="tt"><b>${esc(sc.title)}</b><small>${m0?`${esc(cname(sc[y]))} hocası ${m0}. dakikada ${n0>1?n0+' değişiklik':'değişiklik'} yaptı. Sen olsan?`:'Hoca hiç değişiklik yapmadı. Sen olsan?'}</small></span><span class="go">›</span>`;
  $('#hTicket').onclick=()=>{beep(560);sidePick(sc);};
}
$('#mStory').onclick=()=>{beep(520); const s=store.get('fdStory',null); if(s){ST=s;hub();} else pickScreen('story');};
$('#coachFace').onclick=shoutMenu;
$('#hCoach').onclick=()=>{beep(520);coachScreen(false);};
$('#mQuick').onclick=()=>{beep(520);realList();};
$('#mOnline').onclick=()=>{beep(520);online();};
document.querySelectorAll('[data-go="home"]').forEach(b=>b.onclick=()=>{beep(400);home();});
home();
</script>
</body></html>
